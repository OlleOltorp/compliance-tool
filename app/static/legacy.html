      <div class="actions"><button class="btn" type="submit">${rec ? "Uppdatera" : "Spara"}</button><span class="small" id="intygmsg" role="status"></span></div>
    </form></section>`;
}

function readBase64(file) {
  return new Promise((ok, fail) => {
    const fr = new FileReader();
    fr.onload = () => ok(String(fr.result).replace(/^data:[^,]*,/, ""));
    fr.onerror = () => fail(new Error("Filen kunde inte läsas."));
    fr.readAsDataURL(file);
  });
}

async function submitIntyg(e, rep, r) {
  e.preventDefault();
  const f = e.target, msg = $("#intygmsg"), btn = f.querySelector("button[type=submit]");
  const body = { answer: (f.querySelector("input[name=answer]:checked") || {}).value || null,
                 comment: f.comment.value.trim() };
  const file = f.file.files[0];
  const fail = (t) => { msg.className = "small error"; msg.textContent = t; };
  if (!body.answer && !body.comment && !file) return fail("Svara ja eller nej, skriv en kommentar eller bifoga underlag.");
  if (file && file.size > 10 * 1024 * 1024) return fail("Filen är större än 10 MB.");
  btn.disabled = true; msg.className = "small muted"; msg.textContent = file ? "Laddar upp och läser underlaget…" : "Sparar…";
  try {
    if (file) { body.file_name = file.name; body.file_data = await readBase64(file); }
    let rec;
    if (rep.id === "demo") rec = Object.assign({ pid: r.id, saved: new Date().toISOString(), checked: [],
      file: file ? { name: file.name, path: null, chars: null } : null }, body, { trust: "Butikens egen uppgift" });
    else rec = await api(`/api/scans/${encodeURIComponent(rep.id)}/intyg/${encodeURIComponent(r.id)}`,
      { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    (store.intyg[rep.id] = store.intyg[rep.id] || {})[r.id] = rec;
    if ($("#rp-sections")) $("#rp-sections").innerHTML = sectionsHtml(rep, null, null);
    if (parseRoute().review) { renderDecision(rep, r); return; }
    renderPoint(rep, r.id);
    const m2 = $("#intygmsg"); if (m2) { m2.className = "small muted"; m2.textContent = "Sparat."; }
  } catch (ex) {
    btn.disabled = false; fail(`Kunde inte spara: ${ex.message}`);
  }
}

async function getPage(rep, n) {
  const key = `${rep.id}/${n}`;
  if (store.pages[key]) return store.pages[key];
  if (rep.id === "demo") return (store.pages[key] = rep.pages[n]);
  return (store.pages[key] = await api(`/api/scans/${encodeURIComponent(rep.id)}/pages/${n}`));
}

function renderEvidencePage(rep, pid, k) {
  const r = findResult(rep, pid);
  const e = r && (r.evidence || [])[k];
  if (!e) return renderPoint(rep, pid);
  renderPage(rep, e.page, e.quote, r);
}

async function renderPage(rep, n, quote, fromPoint) {
  const b = base(rep.id);
  const back = fromPoint ? `<a class="back" href="${b}/point/${encodeURIComponent(fromPoint.id)}">← ${esc(fromPoint.id)} ${esc(fromPoint.label)}</a>` : "";
  const meta = (rep.pages || [])[n] || {};
  const head = (p) => `
    <div class="phead">
      <div>${back}<h2 title="${esc(p.title || "")}">${esc(shortTitle(p, rep.shop))}</h2>
        <div class="sub small muted"><span class="kind">${esc(KIND[p.kind] || p.kind || "")}</span>${p.how ? " · " + esc(p.how) : ""} · Hämtad ${esc(fmtDate(rep.finished || rep.started))}</div>
        <div class="small" style="margin-top:4px"><a href="${safeUrl(p.final_url || p.url)}" target="_blank" rel="noopener noreferrer">Öppna sidan i butiken ↗</a></div>
      </div>
      <button class="close" aria-label="Stäng">×</button>
    </div>`;
  showPanel(`${head(meta)}<div class="pbody"><p class="muted">Hämtar sidans text…</p></div>`);
  let page;
  try { page = await getPage(rep, n); }
  catch (ex) { return showPanel(`${head(meta)}<div class="pbody"><p class="error">Kunde inte hämta sidan: ${esc(ex.message)}</p></div>`); }
  const cur = parseRoute();
  if (cur.id !== rep.id || (cur.page !== n && !(cur.point && cur.ev != null))) return;
  const text = page.text || "";
  const span = quote ? locate(text, quote) : null;
  const status = !quote ? "" : span
    ? `<div class="hit ok">Citatet är markerat i texten nedan.</div>`
    : `<div class="hit miss">Citatet kunde inte hittas exakt i sidans text.</div>`;
  showPanel(`${head(Object.assign({}, meta, page))}<div class="pbody">${status}
    ${page.business ? `<div class="note" style="margin-bottom:16px">Sidan gäller företagskunder och används inte som underlag för konsumentpunkter.</div>` : ""}
    ${(store.screens[rep.id] || {})[String(n)] ? `<details class="shotbox" style="margin-bottom:16px"><summary>Skärmbild av sidan</summary><img class="shot" src="${esc(store.screens[rep.id][String(n)])}" alt="Skärmbild av sidan" loading="lazy"></details>` : ""}
    <div class="pagetext">${renderText(text, span)}</div></div>`);
  const m = $("#panel mark");
  if (m) requestAnimationFrame(() => {
    const p = $("#panel");
    p.scrollTop += m.getBoundingClientRect().top - p.clientHeight / 2;
  });
}

/** Find quote in text: exact first, then ignoring whitespace and case. Returns [start, end] or null. */
function locate(text, quote) {
  const i = text.indexOf(quote);
  if (i >= 0) return [i, i + quote.length];
  const map = [];
  let norm = "";
  for (let j = 0; j < text.length; j++) {
    if (/\s/.test(text[j])) { if (norm && norm[norm.length - 1] !== " ") { norm += " "; map.push(j); } }
    else { norm += text[j].toLowerCase(); map.push(j); }
  }
  const q = quote.replace(/\s+/g, " ").trim().toLowerCase();
  if (!q) return null;
  const k = norm.indexOf(q);
  if (k < 0) return null;
  return [map[k], map[k + q.length - 1] + 1];
}

/** Render page text line by line; "## " lines become headings; span [start,end) is wrapped in <mark>. */
function renderText(text, span) {
  let out = "", pos = 0;
  for (const line of text.split("\n")) {
    const start = pos, end = pos + line.length;
    pos = end + 1;
    if (!line.trim()) continue;
    const isHead = line.startsWith("## ");
    const off = isHead ? 3 : 0;
    let body = esc(line.slice(off));
    if (span && span[0] < end && span[1] > start + off) {
      const a = Math.max(span[0], start + off) - start, z = Math.min(span[1], end) - start;
      body = esc(line.slice(off, a)) + "<mark>" + esc(line.slice(a, z)) + "</mark>" + esc(line.slice(z));
    }
    out += isHead ? `<h4>${body}</h4>` : `<p>${body}</p>`;
  }
  return out || `<p class="muted">Sidan innehöll ingen text.</p>`;
}

/* ---------- report: the same screen while the scan runs, during a replay and when it is done ---------- */

const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const SKIP_NAME = { produkt: "Produkt- och kategorilänkar", dubblett: "Dubbletter", tak: "Över taket per sidtyp",
  "läsfel": "Gick inte att läsa", tom: "Tomma sidor", "språk": "Annat språk eller land",
  gammal: "Äldre villkorsversioner", manual: "Manualer, produktblad och kataloger (PDF)" };
const SKIP_ONE = { produkt: "produktlänk", dubblett: "dubblett", tak: "över taket för sidtypen", "läsfel": "gick inte att läsa",
  tom: "tom sida", "språk": "annat språk eller land", gammal: "äldre villkorsversion", manual: "manual eller produktblad (PDF)" };
const KIND_NAME = Object.assign({}, KIND, { produkt: "Produktsida", kampanj: "Kampanjsida", kassa: "Kassan" });
const KIND_ORDER = ["villkor", "retur", "reklamation", "leverans", "betalning", "integritet", "kontakt", "faq", "om", "pdf",
                    "produkt", "kampanj", "kassa"];
const LIVE_DELAY = { log: 60, phase: 250, page_found: 60, page_read: 260, skip: 15, checkout_step: 380, checkout: 100,
                     rule_hit: 170, point: 70, done: 400, failed: 0 };
const STOP = new Set(("eller under efter andra annan annat samt inte detta denna dessa sådan sådana gäller konsumenten konsument " +
  "kunden kunder företaget företag trygg handlaren handlare handel svensk information enligt kunna skall måste finns också " +
  "vilket mellan genom innan sådant vilka varje deras alltid").split(" "));

function dotClass(s) {
  return { "brist": "d-brist", "osäker": "d-osaker", "uppfyllt": "d-ok", "ej tillämplig": "d-na", "råd": "d-rad",
           "kunde inte kontrolleras": "d-kik", "kräver intyg": "d-need", "kräver testköp": "d-need", "kräver underlag": "d-need" }[s] || "d-wait";
}
function dot(s) { return `<i class="d ${dotClass(s)}" aria-hidden="true"></i>`; }
function nf(n) { return n == null ? "–" : Number(n).toLocaleString("sv-SE"); }
function secs(s) {
  if (s == null || isNaN(s)) return "–";
  s = Math.max(0, Math.round(s));
  return s < 60 ? `${s} s` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
function plural(n, one, many) { return `${n} ${n === 1 ? one : many}`; }
function shortPath(u) { const p = pathOf(u); return p || hostOf(u) || String(u || ""); }

/* ---------- what the scan did, from its events ---------- */

function newStats() {
  return { pages: {}, skips: {}, skipList: [], steps: [], reached: null, why: null, checks: 0, hits: 0, points: {}, ev: {},
           hitList: [], phases: [], t: 0, tDone: null, log: "", synthetic: false, failed: null,
           links: null, homeT: null, sitemap: null, sitemapT: null, firstPointT: null, kassaFailed: false, last: null };
}

function reduceStats(S, e) {
  if (typeof e.t === "number") S.t = Math.max(S.t, e.t);
  switch (e.type) {
    case "log": {
      S.log = e.msg;
      let m = /^Startsidan hämtad \((\d+) länkar\)/.exec(e.msg);
      if (m) S.links = Number(m[1]);
      m = /^Sitemap läst \((\d+) adresser, (\d+) relevanta\)/.exec(e.msg);
      if (m) { S.sitemap = { total: Number(m[1]), picked: Number(m[2]) }; S.sitemapT = e.t; }
      if (/^Kassan kunde inte gås igenom/.test(e.msg)) S.kassaFailed = true;
      break;
    }
    case "phase":
      // scans since the parallel crawl send phase_end (ends: true); sidor, produkter and kassa then overlap
      if (e.ends) { if (!S.phases.some((p) => p.name === e.name)) S.phases.push({ name: e.name, t: e.t || 0, ends: true, end: null }); }
      else if (!S.phases.length || S.phases[S.phases.length - 1].name !== e.name) S.phases.push({ name: e.name, t: e.t || 0 });
      break;
    case "phase_end": {
      const p = S.phases.find((x) => x.name === e.name);
      if (p) { p.end = e.t || 0; p.count = e.count; }
      break;
    }
    case "page_found": S.pages[e.n] = Object.assign({}, S.pages[e.n] || {}, { n: e.n, url: e.url, kind: e.kind, how: e.how, found: true }); S.last = e.n; break;
    case "page_read":
      S.pages[e.n] = Object.assign({}, S.pages[e.n] || {}, e, { read: true });
      if (e.n === 0 && S.homeT == null) S.homeT = e.t;
      S.last = e.n;
      break;
    case "skip":
      S.skips[e.reason] = (S.skips[e.reason] || 0) + (e.n || 1);
      if (e.url) S.skipList.push({ reason: e.reason, url: e.url });
      if (e.reason === "sitemap" && !S.sitemap) S.sitemap = { total: null, picked: null, unused: e.n };
      break;
    case "checkout_step": S.steps.push(e); break;
    case "checkout": S.reached = e.reached; S.why = e.why; break;
    case "rule_hit":
      S.hits++;
      (S.ev[e.point] = S.ev[e.point] || []).push({ quote: e.quote, page: e.page, url: e.url, role: e.role });
      S.hitList.push(e);
      S.last = e.page;
      break;
    case "point":
      if (!S.points[e.point]) S.checks += e.checks || 0;
      if (S.firstPointT == null) S.firstPointT = e.t;
      S.points[e.point] = e;
      break;
    case "done":
      S.tDone = e.t;
      // a page reported live but left out of the final list (a sampled page the crawl had too)
      if (typeof e.pages === "number") Object.keys(S.pages).forEach((n) => { if (Number(n) >= e.pages) delete S.pages[n]; });
      break;
    case "failed": S.failed = e.error || "Granskningen misslyckades."; break;
  }
  return S;
}

function pagesRead(S) { return Object.values(S.pages).filter((p) => p.read); }

/** Totals over the pages read. From the events when there are any, else from the report's pages. */
function pageTotals(rep, S) {
  const t = { read: 0, chars: 0, pdf: 0, js: 0, help: 0, product: 0, kassa: 0, kinds: {} };
  const list = S && Object.keys(S.pages).length ? pagesRead(S)
    : (rep.pages || []).map((p) => ({ kind: p.kind, chars: p.n_chars || 0, pdf: p.is_pdf, rendered: p.rendered, help: p.help }));
  list.forEach((p) => {
    t.read++; t.chars += p.chars || 0;
    if (p.pdf) t.pdf++;
    if (p.rendered) t.js++;
    if (p.help) t.help++;
    if (p.kind === "produkt" || p.kind === "kampanj") t.product++;
    if (p.kind === "kassa") t.kassa++;
    const k = t.kinds[p.kind] = t.kinds[p.kind] || { n: 0, chars: 0 };
    k.n++; k.chars += p.chars || 0;
  });
  return t;
}

function phaseT(S, name) { const p = S.phases.find((x) => x.name === name); return p ? p.t : null; }
function nextPhaseT(S, name) {
  const i = S.phases.findIndex((x) => x.name === name);
  return i >= 0 && i + 1 < S.phases.length ? S.phases[i + 1].t : null;
}
/** When a phase ended: its phase_end (overlapping phases), else `fallback` (older, one-after-another events). */
function phaseEnd(S, name, fallback) {
  const p = S.phases.find((x) => x.name === name);
  return p && p.ends ? p.end : fallback;
}

/** The pipeline steps: status, key numbers, detail lines and time. `now` is the scan clock (seconds). */
function stepsOf(S, now, final) {
  const end = S.tDone != null ? S.tDone : null;
  const st = (start, stop) => start == null ? "waiting" : stop != null || final ? "done" : "running";
  const tm = (start, stop) => start == null ? null : (stop != null ? stop : (final ? start : now)) - start;
  const read = pagesRead(S);
  const policy = read.filter((p) => p.n > 0 && !["produkt", "kampanj", "kassa"].includes(p.kind));
  const prods = read.filter((p) => p.kind === "produkt" || p.kind === "kampanj");
  const t0 = phaseT(S, "start") != null ? phaseT(S, "start") : phaseT(S, "sidor") != null ? phaseT(S, "sidor") : 0;
  const tProd = phaseT(S, "produkter"), tKassa = phaseT(S, "kassa"), tRules = phaseT(S, "regler");
  const after = (...ts) => ts.find((x) => x != null);
  const steps = [];

  // 1. start page
  const home = S.pages[0];
  steps.push({ key: "start", title: "Startsidan hämtad", status: st(t0, S.homeT), time: tm(t0, S.homeT),
    nums: S.links != null ? `<span class="num">${nf(S.links)}</span> länkar` : "",
    lines: home ? [[shortPath(home.url), home.rendered ? "läst i webbläsare" : ""]] : [] });

  // 2. robots.txt and sitemap
  const s2start = S.homeT, s2end = S.sitemapT != null ? S.sitemapT : (policy.length || tProd != null ? after(policy[0] && policy[0].t, phaseEnd(S, "sidor", tProd)) : null);
  const sm = S.sitemap;
  steps.push({ key: "sitemap", title: "robots.txt och webbplatskarta lästa", status: S.synthetic && !sm ? (final ? "skipped" : "waiting") : st(s2start, s2end),
    time: tm(s2start, s2end),
    nums: sm && sm.total != null ? `<span class="num">${nf(sm.total)}</span> adresser, <span class="num">${nf(sm.picked)}</span> valda` : "",
    lines: sm && sm.total != null ? [["Webbplatskarta", `${nf(sm.total)} adresser (inte lästa)`], ["Valda för läsning", `${nf(sm.picked)} som ser ut som villkor, retur, leverans …`]] : [] });

  // 3. policy pages
  const s3start = after(S.sitemapT, S.homeT), s3end = phaseEnd(S, "sidor", after(tProd, tKassa, tRules, end));
  const kinds = {};
  policy.forEach((p) => (kinds[p.kind] = (kinds[p.kind] || 0) + 1));
  const kindTxt = KIND_ORDER.filter((k) => kinds[k]).map((k) => `${(KIND_NAME[k] || k).toLowerCase()} ${kinds[k]}`).join(" · ");
  const extra = [["PDF", policy.filter((p) => p.pdf).length], ["JavaScript", policy.filter((p) => p.rendered).length],
                 ["hjälpcenter", policy.filter((p) => p.help).length]].filter((x) => x[1]).map(([l, n]) => `${l} ${n}`).join(" · ");
  const skipped = S.skipList.filter((x) => x.reason !== "produkt");
  steps.push({ key: "policy", title: "Policysidor hittade och lästa", status: st(s3start, s3end), time: tm(s3start, s3end),
    nums: policy.length ? `<span class="num">${policy.length}</span> sidor${skipped.length ? `, <span class="num">${skipped.length}</span> hoppade över` : ""}` : "",
    sub: [kindTxt, extra].filter(Boolean).join(" · "),
    lines: policy.map((p) => [shortPath(p.url), [KIND_NAME[p.kind] || p.kind, p.rendered && "JavaScript", p.help && "hjälpcenter", p.pdf && "PDF"].filter(Boolean).join(" · "), p.n])
      .concat(skipped.map((x) => [shortPath(x.url), "hoppade över: " + (SKIP_ONE[x.reason] || x.reason), null, true])) });

  // 4. product and campaign pages
  const s4end = phaseEnd(S, "produkter", after(tKassa, tRules, end));
  const s4 = tProd == null ? (s4end != null || final ? "skipped" : "waiting") : st(tProd, s4end);
  steps.push({ key: "produkt", title: "Produkt- och kampanjsidor", status: s4, time: tm(tProd, s4end),
    nums: prods.length ? `<span class="num">${prods.length}</span> ${prods.length === 1 ? "sida" : "sidor"} i stickprov` : (s4 === "skipped" ? "hoppades över" : ""),
    lines: prods.map((p) => [shortPath(p.url), KIND_NAME[p.kind] || p.kind, p.n]) });

  // 5. checkout
  const s5end = phaseEnd(S, "kassa", after(tRules, end));
  let s5 = tKassa == null ? (s5end != null || final ? "skipped" : "waiting") : st(tKassa, s5end);
  if (S.kassaFailed) s5 = "failed";
  const chain = S.steps.map((x) => x.name).filter(Boolean).join(" → ");
  steps.push({ key: "kassa", title: "Kassan", status: s5, time: tm(tKassa, s5end),
    nums: chain ? esc(chain) : (s5 === "skipped" ? "hoppades över" : s5 === "failed" ? "kunde inte gås igenom" : ""),
    shots: S.steps.filter((x) => x.screen).map((x) => ({ src: screenUrl({ snapshot: null }, x.screen), name: x.name, step: x.step })),
    lines: (S.why ? [["Stannade", S.why]] : []).concat(S.steps.map((x) => [`Steg ${x.step}: ${x.name || ""}`, x.total != null ? `${nf(x.total)} kr` : ""])) });

  // 6. rules
  const s6end = end != null ? end : null;
  steps.push({ key: "regler", title: "Regler körda", status: st(tRules, s6end), time: tm(tRules, s6end),
    nums: tRules != null ? `<span class="num">${nf(S.checks)}</span> kontroller, <span class="num">${nf(S.hits)}</span> träffar` : "",
    lines: S.hitList.slice().reverse().map((h) => [`${h.point} ← ${shortPath(h.url)}`, `”${String(h.quote).slice(0, 90)}${String(h.quote).length > 90 ? "…" : ""}”`]) });

  // 7. points
  const c = {};
  Object.values(S.points).forEach((p) => { const s = stateOf({ id: p.point, state: p.state }); c[s] = (c[s] || 0) + 1; });
  const decided = Object.keys(S.points).length;
  steps.push({ key: "punkter", title: "45 punkter bedömda", status: st(S.firstPointT, end), time: tm(S.firstPointT, end),
    nums: decided ? `<span class="num">${decided}</span>/45` : "",
    sub: ["brist", "osäker", "uppfyllt", "ej tillämplig", KIK, "kräver intyg", "kräver testköp"].filter((s) => c[s])
      .map((s) => `${dot(s)}${esc(s)} <span class="num">${c[s]}</span>`).join(" "),
    lines: [] });
  return steps;
}

const STEP_ICON = { waiting: "", running: "", done: "✓", skipped: "–", failed: "×" };
const STEP_STATUS = { waiting: "väntar", running: "pågår", done: "klar", skipped: "hoppades över", failed: "misslyckades" };

function stepBody(s, open) {
  const lines = s.lines || [];
  const show = open ? lines : (s.status === "running" ? lines.slice(-4) : []);
  return (s.sub ? `<div class="st-sub">${s.sub}</div>` : "")
    + (s.shots && s.shots.length ? `<div class="st-shots">${s.shots.map((x) => x.src ? `<figure><img src="${esc(x.src)}" alt="Skärmbild av kassan, steg ${esc(x.step)}" loading="lazy"><figcaption>${esc(x.step)}. ${esc(x.name || "")}</figcaption></figure>` : "").join("")}</div>` : "")
    + (show.length ? `<ul class="st-lines">${show.map(([a, b, n, skip]) => `<li class="${skip ? "sk" : ""}"${n != null ? ` data-n="${n}"` : ""}><span class="a">${esc(a)}</span><span class="b">${esc(b || "")}</span></li>`).join("")}</ul>` : "")
    + (!open && lines.length > show.length ? `<div class="st-more">${plural(lines.length, "rad", "rader")} – klicka för att visa</div>` : "");
}

/** Update the step list in place, so spinners and open steps keep their state. */
function renderSteps(box, steps, openSet) {
  if (!box) return;
  steps.forEach((s, i) => {
    let li = box.children[i];
    if (!li) {
      li = document.createElement("li");
      li.className = "st";
      li.dataset.key = s.key;
      li.innerHTML = `<button type="button" class="st-h" aria-expanded="false"><span class="st-i" aria-hidden="true"></span>
        <span class="st-t"></span><span class="st-n"></span><span class="st-time num"></span></button><div class="st-d"></div>`;
      li.querySelector(".st-h").addEventListener("click", () => {
        if (openSet.has(s.key)) openSet.delete(s.key); else openSet.add(s.key);
        li._html = null;
        if (box._refresh) box._refresh();
      });
      box.appendChild(li);
    }
    if (li._status !== s.status) {
      li.className = `st st-${s.status}${li._status && li._status !== "waiting" ? "" : " enter"}`;
      li.querySelector(".st-i").textContent = STEP_ICON[s.status];
      li.querySelector(".st-i").title = STEP_STATUS[s.status];
      li._status = s.status;
    }
    const open = openSet.has(s.key);
    li.querySelector(".st-h").setAttribute("aria-expanded", String(open));
    li.querySelector(".st-t").textContent = s.title;
    const n = s.nums || (s.status === "waiting" ? "väntar" : "");
    if (li._nums !== n) { li.querySelector(".st-n").innerHTML = n; li._nums = n; }
    li.querySelector(".st-time").textContent = s.status === "waiting" || s.status === "skipped" ? "" : secs(s.time);
    const html = stepBody(s, open);
    if (li._html !== html) { li.querySelector(".st-d").innerHTML = html; li._html = html; }
  });
}

function summaryLine(rep, S) {
  const t = pageTotals(rep, S);
  const parts = [`<span class="num">${nf(t.read)}</span> sidor lästa`];
  if (S && S.sitemap && S.sitemap.total != null) parts.push(`webbplatskarta <span class="num">${nf(S.sitemap.total)}</span> adresser (inte lästa)`);
  const reached = S && S.reached != null ? S.reached : (rep.checkout || {}).reached;
  const chain = S && S.steps.length ? S.steps.map((x) => x.name).join(" → ") : null;
  if (chain || reached) parts.push(`kassan: ${esc(chain || reached)}`);
  const rs = resultsOf(rep);
  const checks = rs.reduce((k, r) => k + (r.pages_read || []).length, 0) || (S ? S.checks : 0);
  const hits = S ? S.hits : rs.reduce((k, r) => k + (r.evidence || []).filter((e) => e.quote).length, 0);
  parts.push(`<span class="num">${nf(checks)}</span> kontroller`, `<span class="num">${nf(hits)}</span> träffar`,
             `<span class="num">${rs.length}</span>/45 punkter`, `<span class="num">${secs(totalTime(rep, S))}</span>`);
  return `<span class="ok">✓</span> ` + parts.join(" · ");
}

/** Seconds per phase: from the events' clock, or (reports without events) the report's own timing. */
function phaseTimes(rep, S) {
  if (S && !S.synthetic && S.phases.length) {
    const end = S.tDone != null ? S.tDone : S.t;
    const name = { start: "Startsidan", sidor: "Sidor", produkter: "Produktsidor", kassa: "Kassan", regler: "Regler" };
    return S.phases.map((p, i) => [name[p.name] || p.name,
      (p.ends ? (p.end != null ? p.end : end) : i + 1 < S.phases.length ? S.phases[i + 1].t : end) - p.t]);
  }
  const tm = rep.timing || {};
  const total = rep.finished && rep.started ? (new Date(rep.finished) - new Date(rep.started)) / 1000 : null;
  const rows = [["Sidor", tm.sidor], ["Produktsidor", tm.produkter], ["Kassan", tm.kassa]].filter((r) => r[1] != null);
  const used = rows.reduce((n, r) => n + r[1], 0);
  if (total != null && total - used > 0) rows.push(["Regler och sparande", total - used]);
  return rows;
}

function totalTime(rep, S) {
  if (S && !S.synthetic && S.tDone != null) return S.tDone;
  if (rep.finished && rep.started) return (new Date(rep.finished) - new Date(rep.started)) / 1000;
  return S ? S.t : null;
}

/* ---------- process graph: start → sources → pages → points, laid out in fixed columns ---------- */

const SOURCES = [["links", "Länkar"], ["sitemap", "Webbplatskarta"], ["fixed", "Kända adresser"], ["help", "Hjälpcenter"],
                 ["sample", "Stickprov"], ["kassa", "Kassaskript"]];

function sourceOf(p) {
  const how = String(p.how || "");
  if (p.kind === "kassa") return "kassa";
  if (p.kind === "produkt" || p.kind === "kampanj") return "sample";
  if (p.help) return "help";
  if (/^Sitemap/.test(how)) return "sitemap";
  if (/fasta adress/i.test(how)) return "fixed";
  return "links";
}

function graphModel(S, points, compact) {
  const W = compact ? 360 : 680;
  const X = compact ? { start: 8, src: 60, page: 178, pt: 300 } : { start: 10, src: 104, page: 300, pt: 604 };
  const ROW = compact ? 11 : 13, HEAD = compact ? 13 : 16, TOP = 22;
  const pages = pagesRead(S).filter((p) => p.n > 0).concat(Object.values(S.pages).filter((p) => !p.read && p.n > 0));
  const byKind = {};
  pages.forEach((p) => (byKind[p.kind] = byKind[p.kind] || []).push(p));
  const kinds = KIND_ORDER.filter((k) => byKind[k]).concat(Object.keys(byKind).filter((k) => !KIND_ORDER.includes(k)));
  const nodes = [], groups = [];
  let y = TOP;
  kinds.forEach((k) => {
    groups.push({ kind: k, y: y + HEAD * 0.6 });
    y += HEAD;
    byKind[k].sort((a, z) => a.n - z.n).forEach((p) => { nodes.push({ p, y, src: sourceOf(p) }); y += ROW; });
    y += 4;
  });
  const pagesH = y;
  // points column, grouped by section
  const pts = [];
  let py = TOP, sec = null;
  const PROW = compact ? 10.5 : 11.5;
  points.forEach((q) => {
    const s = sectionOf(q.id);
    if (sec !== null && s !== sec) py += compact ? 4 : 5;
    sec = s;
    pts.push({ id: q.id, label: q.label, y: py });
    py += PROW;
  });
  // sources: at the mean height of their pages, kept apart
  const srcs = [];
  SOURCES.forEach(([key, label]) => {
    const own = nodes.filter((n) => n.src === key);
    if (!own.length && !(key === "sitemap" && S.sitemap && S.sitemap.total)) return;
    const mean = own.length ? own.reduce((a, n) => a + n.y, 0) / own.length : TOP + 30;
    srcs.push({ key, label, n: own.length, y: mean });
  });
  srcs.sort((a, z) => a.y - z.y);
  const gap = compact ? 22 : 26;
  for (let i = 1; i < srcs.length; i++) srcs[i].y = Math.max(srcs[i].y, srcs[i - 1].y + gap);
  const H = Math.max(pagesH, py, (srcs.length ? srcs[srcs.length - 1].y : 0) + 20, 160) + 10;
  const start = { y: srcs.length ? (srcs[0].y + srcs[srcs.length - 1].y) / 2 : TOP + 30 };
  return { W, H, X, nodes, groups, pts, srcs, start, compact };
}

/** Draws and updates the graph in an <svg>. Nodes are keyed, so new ones fade in and moved ones glide. */
class ProcessGraph {
  constructor(svg, tip, opts) {
    this.svg = svg; this.tip = tip; this.opts = opts || {};
    this.els = {}; this.pinned = null;
    svg.addEventListener("mouseover", (e) => { const g = e.target.closest("[data-n]"); if (g) this.show(Number(g.dataset.n)); });
    svg.addEventListener("mouseout", (e) => { const g = e.target.closest("[data-n]"); if (g && this.pinned == null) this.hide(); });
    svg.addEventListener("click", (e) => {
      const g = e.target.closest("[data-n]");
      if (!g) { this.pinned = null; this.hide(); return; }
      const n = Number(g.dataset.n);
      this.pinned = this.pinned === n ? null : n;
      if (this.pinned == null) this.hide(); else this.show(n);
    });
  }
  el(key, tag, parent, attrs) {
    let e = this.els[key];
    if (!e) {
      e = document.createElementNS("http://www.w3.org/2000/svg", tag);
      e.classList.add("new");
      (parent || this.svg).appendChild(e);
      this.els[key] = e;
      setTimeout(() => e.classList.remove("new"), 30);
    }
    for (const k in attrs || {}) if (e.getAttribute(k) !== String(attrs[k])) e.setAttribute(k, attrs[k]);
    return e;
  }
  update(S, points, results) {
    this.S = S; this.results = results || {};
    const compact = (this.svg.parentNode.clientWidth || 700) < 520;
    if (this.compact !== compact) { this.compact = compact; this.svg.innerHTML = ""; this.els = {}; }
    const M = this.M = graphModel(S, points, compact);
    const fs = compact ? 8.5 : 10;
    this.svg.setAttribute("viewBox", `0 0 ${M.W} ${M.H}`);
    if (!this.layers) this.layers = {};
    ["edges", "hits", "nodes", "labels"].forEach((k) => {
      if (!this.layers[k] || !this.layers[k].isConnected) {
        this.layers[k] = document.createElementNS("http://www.w3.org/2000/svg", "g");
        this.layers[k].setAttribute("class", "g-" + k);
        this.svg.appendChild(this.layers[k]);
      }
    });
    const L = this.layers;
    // column titles
    const titles = compact ? [["Start", M.X.start], ["Källor", M.X.src], ["Sidor", M.X.page], ["Punkter", M.X.pt]]
                           : [["Start", M.X.start], ["Källor", M.X.src], ["Sidor", M.X.page], ["Svensk Handels punkter", M.X.pt]];
    titles.forEach(([t, x], i) => { const e = this.el("title" + i, "text", L.labels, { x, y: 10, class: "g-col" }); e.textContent = t; });
    // start node
    const home = S.pages[0];
    this.el("start", "circle", L.nodes, { cx: M.X.start + 4, cy: M.start.y, r: 5, class: "g-start" + (home && home.read ? "" : " pend") });
    const sl = this.el("start-l", "text", L.labels, { x: M.X.start, y: M.start.y + 16, class: "g-lbl" });
    sl.textContent = compact ? "" : (hostOf(home ? home.url : "") || "startsida");
    // sources
    M.srcs.forEach((s) => {
      this.el("e-src-" + s.key, "path", L.edges, { d: curve(M.X.start + 9, M.start.y, M.X.src - 4, s.y), class: "g-e" });
      this.el("src-" + s.key, "rect", L.nodes, { x: M.X.src - 4, y: s.y - 4, width: 8, height: 8, class: "g-src" });
      const t = this.el("src-l-" + s.key, "text", L.labels, { x: M.X.src + 8, y: s.y + 3.5, class: "g-lbl" });
      t.textContent = s.key === "sitemap" && S.sitemap && S.sitemap.total && !compact ? `${s.label} (${nf(S.sitemap.total)})` : `${compact && s.key === "sitemap" ? "Karta" : s.label} ${s.n || ""}`;
    });
    // kind headings
    Object.keys(this.els).filter((k) => k.startsWith("grp-")).forEach((k) => { if (!M.groups.some((g) => "grp-" + g.kind === k)) { this.els[k].remove(); delete this.els[k]; } });
    M.groups.forEach((g) => {
      const t = this.el("grp-" + g.kind, "text", L.labels, { x: M.X.page - 4, y: g.y, class: "g-grp" });
      t.textContent = (KIND_NAME[g.kind] || g.kind).toLowerCase();
    });
    // pages
    const active = S.last;
    M.nodes.forEach(({ p, y, src }) => {
      const s = M.srcs.find((x) => x.key === src);
      this.el("e-pg-" + p.n, "path", L.edges, { d: curve(M.X.src + 4, s ? s.y : y, M.X.page - 4, y), class: "g-e" });
      const g = this.el("pg-" + p.n, "g", L.nodes, { "data-n": p.n, class: "g-pg" + (p.read ? "" : " pend") + (p.n === active && !S.tDone ? " active" : "") });
      g.style.transform = `translate(${M.X.page}px, ${y}px)`;
      if (!g.firstChild) g.innerHTML = `<circle class="g-ring" r="3.5"></circle><circle r="3.5"></circle><rect class="g-hit" x="-6" y="-6" width="${compact ? 14 : 150}" height="12"></rect>`;
      if (!compact) {
        const t = this.el("pg-l-" + p.n, "text", L.labels, { x: M.X.page + 8, y: y + 3.5, class: "g-lbl g-pl", "data-n": p.n });
        const label = shortPath(p.url);
        t.textContent = label.length > 26 ? label.slice(0, 25) + "…" : label;
      }
    });
    // points
    M.pts.forEach((q) => {
      const r = this.results[q.id];
      this.el("pt-" + q.id, "circle", L.nodes, { cx: M.X.pt, cy: q.y, r: 3.6, class: "g-pt " + (r ? dotClass(stateOf(r)) : "d-wait") });
      const t = this.el("pt-l-" + q.id, "text", L.labels, { x: M.X.pt + 7, y: q.y + 3.2, class: "g-lbl g-ptl" });
      t.textContent = q.id;
    });
    // page → point edges, one per page and point
    const seen = new Set();
    S.hitList.forEach((h) => {
      const node = M.nodes.find((n) => n.p.n === h.page), q = M.pts.find((x) => x.id === h.point);
      const k = h.page + ">" + h.point;
      if (!node || !q || seen.has(k)) return;
      seen.add(k);
      const x0 = compact ? M.X.page + 5 : M.X.page + 148;
      this.el("h-" + k, "path", L.hits, { d: curve(x0, node.y, M.X.pt - 5, q.y), class: "g-h", "data-n": h.page, "data-pt": h.point });
    });
    if (this.pinned != null) this.show(this.pinned);
  }
  show(n) {
    const S = this.S, p = S && S.pages[n];
    if (!p || !this.tip) return;
    const pts = [...new Set(S.hitList.filter((h) => h.page === n).map((h) => h.point))];
    this.svg.classList.add("focus");
    this.svg.querySelectorAll(".g-h").forEach((e) => e.classList.toggle("on", Number(e.dataset.n) === n));
    this.svg.querySelectorAll(".g-pg").forEach((e) => e.classList.toggle("on", Number(e.dataset.n) === n));
    this.tip.innerHTML = `<b>${esc(p.title ? String(p.title).split(/\s[|–—\-:·»]\s/)[0] : KIND_NAME[p.kind] || "Sida")}</b>
      <div class="u">${esc(p.url)}</div>
      <div>${esc(KIND_NAME[p.kind] || p.kind || "")}${p.chars ? ` · ${nf(p.chars)} tecken` : ""}${p.rendered ? " · JavaScript" : ""}</div>
      <div class="pts">${pts.length ? "Underlag för " + pts.map((id) => `${dot(this.results[id] ? stateOf(this.results[id]) : null)}${esc(id)}`).join(" ") : "Inget citat från sidan än."}</div>`;
    const node = this.M && this.M.nodes.find((x) => x.p.n === n);
    if (node) {
      const box = this.svg.getBoundingClientRect(), k = box.width / this.M.W;
      const fig = this.svg.parentNode.getBoundingClientRect();
      let left = box.left - fig.left + (this.M.X.page + 10) * k, top = box.top - fig.top + node.y * k + 10;
      left = Math.max(4, Math.min(left, fig.width - 270));
      this.tip.style.left = left + "px"; this.tip.style.top = top + "px";
    }
    this.tip.hidden = false;
  }
  hide() {
    if (!this.tip) return;
    this.tip.hidden = true;
    this.svg.classList.remove("focus");
    this.svg.querySelectorAll(".g-h.on, .g-pg.on").forEach((e) => e.classList.remove("on"));
  }
}

function curve(x0, y0, x1, y1) {
  const m = (x0 + x1) / 2;
  return `M${x0.toFixed(1)},${y0.toFixed(1)} C${m.toFixed(1)},${y0.toFixed(1)} ${m.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
}

/* ---------- pieces of the report ---------- */

function resultsOf(rep) { return rep.results || []; }

function countStates(results) {
  const c = {};
  results.forEach((r) => { const s = stateOf(r); c[s] = (c[s] || 0) + 1; });
  return c;
}

function leadText(rep) {
  const c = countStates(resultsOf(rep));
  const b = c["brist"] || 0, o = (c["osäker"] || 0) + (c["råd"] || 0), u = c["uppfyllt"] || 0;
  const need = (c["kräver intyg"] || 0) + (c["kräver testköp"] || 0), other = (c["ej tillämplig"] || 0) + (c[KIK] || 0);
  const first = b ? `Vi hittade ${plural(b, "brist", "brister")} mot Svensk Handels krav` : "Vi hittade inga brister mot Svensk Handels krav i det vi läste";
  const second = o ? ` och ${plural(o, "punkt", "punkter")} som behöver granskas av en människa.` : ".";
  const rest = [u && `${plural(u, "punkt är uppfylld", "punkter är uppfyllda")}`,
                need && `${need} kräver underlag från butiken`,
                other && `${other} gick inte att bedöma eller gäller inte butiken`].filter(Boolean);
  return first + second + (rest.length ? " " + rest.join(", ").replace(/^./, (m) => m.toUpperCase()) + "." : "");
}

function mapHtml(rep, points) {
  const by = {};
  resultsOf(rep).forEach((r) => (by[r.id] = r));
  const sec = {};
  points.forEach((p) => (sec[sectionOf(p.id)] = sec[sectionOf(p.id)] || []).push(p));
  const b = base(rep.id);
  return Object.keys(sec).map(Number).sort((a, z) => a - z).map((k) => `<div><h3>${k}. ${esc(SECTIONS[k] || "Övrigt")}</h3><ul>${sec[k].map((p) => {
    const r = by[p.id];
    const s = r ? stateOf(r) : null;
    return `<li><a href="${b}/point/${encodeURIComponent(p.id)}" data-pid="${esc(p.id)}" title="${esc(p.id + " " + p.label + (s ? " · " + s : ""))}">`
         + `<i class="d ${s ? dotClass(s) : "d-wait"}" aria-hidden="true"></i>${esc(p.id)}</a></li>`;
  }).join("")}</ul></div>`).join("");
}

function legendHtml(rep) {
  const c = countStates(resultsOf(rep));
  const need = (c["kräver intyg"] || 0) + (c["kräver testköp"] || 0);
  const items = [["brist", "Brist", c["brist"]], ["osäker", "Att granska", (c["osäker"] || 0) + (c["råd"] || 0)], ["uppfyllt", "Uppfyllt", c["uppfyllt"]],
    ["ej tillämplig", "Ej tillämplig", c["ej tillämplig"]], [KIK, "Kunde inte kontrolleras", c[KIK]], ["kräver intyg", "Kräver underlag", need]];
  return items.filter((x) => x[2] || ["brist", "osäker", "uppfyllt"].includes(x[0])).map(([s, l, n]) =>
    `<span>${dot(s)}${l} <span class="num">${n || 0}</span></span>`).join("");
}

/** Short line from Svensk Handel's requirement: its first clause, cut at a word. */
function shortReq(sh) {
  let s = String(sh || "").trim().replace(/\s+/g, " ");
  const m = s.match(/^(.{50,170}?)[.;:](\s|$)/);
  if (m) s = m[1];
  else if (s.length > 170) s = s.slice(0, 170).replace(/\s+\S*$/, "") + " …";
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/** Quote with the words it shares with the requirement underlined. */
function underlineKeys(quote, ref) {
  const stems = [...new Set((String(ref).toLowerCase().match(/[a-zåäöéü]{5,}/g) || []).filter((w) => !STOP.has(w)).map((w) => w.slice(0, 6)))];
  const words = String(quote).match(/[A-Za-zÅÄÖåäöÉéÜü]+/g) || [];
  const hit = (w) => w.length >= 5 && !STOP.has(w.toLowerCase()) && stems.some((s) => w.toLowerCase().includes(s));
  if (!stems.length || words.filter(hit).length > words.length * 0.4) return esc(quote);
  return String(quote).split(/([A-Za-zÅÄÖåäöÉéÜü]+)/).map((part, i) => i % 2 && hit(part) ? `<u>${esc(part)}</u>` : esc(part)).join("");
}

function bristCard(rep, r) {
  const b = base(rep.id);
  const ev = r.evidence || [];
  let k = ev.findIndex((e) => e.role === "brist" && e.quote);
  if (k < 0) k = ev.findIndex((e) => e.quote);
  const e = ev[k];
  return `<article class="bc" data-pid="${esc(r.id)}">
    <p class="bc-verdict">${esc(r.summary || r.label)}</p>
    <p><span class="k">Svensk Handel kräver:</span>${esc(shortReq(r.sh))}</p>
    ${e ? `<p class="k" style="margin:0">Butiken skriver:</p><blockquote class="bc-quote">${underlineKeys(e.quote, (r.sh || "") + " " + (r.label || ""))}</blockquote>` : ""}
    <p class="bc-foot">${e ? `<a href="${b}/point/${encodeURIComponent(r.id)}/ev/${k}">Visa på sidan</a>` : ""}
      <a href="${b}/point/${encodeURIComponent(r.id)}">Mer om bedömningen</a>
      <span class="pidl">${esc(r.id)} ${esc(r.label)}</span></p>
  </article>`;
}

function row(rep, r, text) {
  return `<li><a href="${base(rep.id)}/point/${encodeURIComponent(r.id)}" data-pid="${esc(r.id)}">
    <span class="t">${esc(text)}</span><span class="m">${esc(r.label)} · <span class="pidl">${esc(r.id)}</span>${OUTDATED[r.id] ? " · Svensk Handels krav föråldrat" : ""}</span></a></li>`;
}

function needText(rep, r) {
  const rec = (store.intyg[rep.id] || {})[r.id];
  if (stateOf(r) === "kräver intyg")
    return rec ? `Besvarat${rec.answer ? ": " + rec.answer : ""}${rec.file ? " · underlag bifogat" : ""}` : (INTYG[r.id] || r.summary || "");
  return TESTKOP[r.id] || r.summary || "";
}

function fold(key, title, n, sub, inner) {
  const open = store.open && store.open[key];
  return `<details class="rp-fold" data-fold="${key}"${open ? " open" : ""}><summary>${esc(title)} (${n})</summary>
    <div class="in">${sub ? `<p class="sub">${sub}</p>` : ""}${inner}</div></details>`;
}

function sectionsHtml(rep) {
  const rs = resultsOf(rep);
  const brist = rs.filter((r) => stateOf(r) === "brist");
  const granska = rs.filter((r) => ["osäker", "råd"].includes(stateOf(r)));
  const ok = rs.filter((r) => stateOf(r) === "uppfyllt");
  const other = rs.filter((r) => ["ej tillämplig", KIK].includes(stateOf(r)));
  const need = rs.filter((r) => isNeed(r));
  let out = `<section class="rp-sec" id="brister"><h2>Brister${brist.length ? ` (${brist.length})` : ""}</h2>
    ${brist.length ? `<p class="sub">Här säger butikens text emot Svensk Handels krav.</p>${brist.map((r) => bristCard(rep, r)).join("")}`
                   : `<p class="rp-empty">Inga brister hittades i texterna vi läste.</p>`}</section>`;
  if (granska.length) out += `<section class="rp-sec" id="granska"><h2>Att granska (${granska.length})</h2>
    <p class="sub">Osäkra punkter är inga brister. Vi hittade något som kan vara ett problem, eller hittade inte det vi letade efter; en människa behöver titta.</p>
    <ul class="rl">${granska.map((r) => row(rep, r, r.summary || r.label)).join("")}</ul></section>`;
  const folds = [];
  if (ok.length) folds.push(fold("ok", "Uppfyllt", ok.length, "", `<ul class="rl">${ok.map((r) => row(rep, r, r.summary || r.label)).join("")}</ul>`));
  if (other.length) folds.push(fold("other", "Gäller inte eller gick inte att kontrollera", other.length, "",
    `<ul class="rl">${other.map((r) => row(rep, r, r.summary || r.label)).join("")}</ul>`));
  if (need.length) folds.push(fold("need", "Kräver underlag från butiken", need.length,
    "Interna rutiner och sådant som kräver ett testköp syns inte på webbplatsen. Butiken kan svara och bifoga underlag under respektive punkt.",
    `<ul class="rl">${need.map((r) => row(rep, r, needText(rep, r))).join("")}</ul>`));
  if (folds.length) out += `<section class="rp-sec" id="underlag">${folds.join("")}</section>`;
  return out;
}

function factsHtml(rep, S) {
  const t = pageTotals(rep, S);
  const skips = S ? S.skips : {};
  const skipped = Object.keys(skips).filter((k) => k !== "sitemap").reduce((a, k) => a + skips[k], 0);
  const rs = resultsOf(rep);
  const c = countStates(rs);
  const steps = S && S.steps.length ? S.steps.length : ((rep.checkout || {}).steps || []).length;
  const reached = S && S.reached != null ? S.reached : (rep.checkout || {}).reached;
  const hits = S ? S.hits : rs.reduce((k, r) => k + (r.evidence || []).filter((e) => e.quote).length, 0);
  const checks = rs.reduce((k, r) => k + (r.pages_read || []).length, 0) || (S ? S.checks : 0);
  const dd = (label, v) => `<dd><span>${label}</span><span class="num">${v}</span></dd>`;
  const known = S && !S.synthetic && Object.keys(skips).length > 0;
  const sm = S && S.sitemap;
  let html = `<div class="facts">
    <dl><dt>Sidor</dt>${dd("Hittade adresser", known ? nf(t.read + skipped) : "–")}${dd("Lästa", nf(t.read))}${dd("Hoppade över", known ? nf(skipped) : "–")}
      ${Object.keys(SKIP_NAME).filter((k) => skips[k]).map((k) => dd(SKIP_NAME[k], nf(skips[k]))).join("")}
      ${sm && sm.total != null ? dd("Webbplatskarta", `${nf(sm.total)} adresser (inte lästa)`) : ""}</dl>
    <dl><dt>Text</dt>${dd("Tecken", nf(t.chars))}${dd("PDF", nf(t.pdf))}
      ${dd("Lästa med JavaScript", nf(t.js))}${dd("Hjälpcenter", nf(t.help))}${dd("Produktsidor (stickprov)", nf(t.product))}</dl>
    <dl><dt>Kassan</dt>${dd("Steg", nf(steps))}${dd("Kom till", esc(reached || "–"))}</dl>
    <dl><dt>Regler</dt>${dd("Kontroller (punkt × sida)", nf(checks))}${dd("Träffar (citat)", nf(hits))}${dd("Punkter avgjorda", `${rs.length}/45`)}
      ${["brist", "osäker", "uppfyllt", "ej tillämplig", KIK, "kräver intyg", "kräver testköp"].filter((s) => c[s]).map((s) => dd(`${dot(s)} ${esc(s)}`, c[s])).join("")}</dl>
  </div>`;
  const times = phaseTimes(rep, S);
  const kinds = Object.entries(t.kinds).sort((a, z) => z[1].n - a[1].n);
  const onPage = {};
  rs.forEach((r) => (r.evidence || []).forEach((e) => {
    if (typeof e.page === "number" && e.quote) { const s = onPage[e.page] = onPage[e.page] || []; if (!s.includes(r)) s.push(r); }
  }));
  const pages = rep.pages || [];
  html += `<div class="ftables">
    <table class="ft"><caption>Tid per fas</caption><tbody>${times.map(([n, s]) => `<tr><td>${esc(n)}</td><td class="r">${secs(s)}</td></tr>`).join("")}
      <tr><td><b>Totalt</b></td><td class="r"><b>${secs(totalTime(rep, S))}</b></td></tr></tbody></table>
    <table class="ft"><caption>Sidor per typ</caption><thead><tr><th>Typ</th><th class="r">Sidor</th><th class="r">Tecken</th></tr></thead>
      <tbody>${kinds.map(([k, v]) => `<tr><td>${esc(KIND_NAME[k] || k || "Övrigt")}</td><td class="r">${v.n}</td><td class="r">${nf(v.chars)}</td></tr>`).join("")}</tbody></table>
  </div>
  <table class="ft" style="margin-top:16px"><caption>Vilka sidor punkterna bygger på</caption>
    <thead><tr><th>Sida</th><th>Punkter</th></tr></thead><tbody>${Object.keys(onPage).map(Number).sort((a, z) => a - z).map((n) => `<tr>
      <td><a href="${base(rep.id)}/page/${n}">${esc(pages[n] ? shortTitle(pages[n], rep.shop) : "Sida " + n)}</a>
        <div class="ids">${esc(pathOf((pages[n] || {}).final_url || (pages[n] || {}).url) || "/")}</div></td>
      <td>${onPage[n].map((r) => `<a class="ids" style="text-decoration:none;margin-right:10px;white-space:nowrap" href="${base(rep.id)}/point/${encodeURIComponent(r.id)}">${dot(stateOf(r))} ${esc(r.id)}</a>`).join(" ")}</td>
    </tr>`).join("") || `<tr><td colspan="2" class="ids">Inga citat.</td></tr>`}</tbody></table>`;
  return html;
}

function graphFigure(id) {
  return `<figure class="gr" id="${id}"><svg class="pg" role="img" aria-label="Granskningens steg: startsidan, källorna, sidorna som lästes och punkterna de gav underlag för"></svg>
    <div class="gtip" hidden></div></figure>`;
}

/** The finished report. */
function renderReport(rep) {
  const S = store.stats[rep.id] || null;
  const shop = rep.shop || hostOf(rep.url || rep.input);
  const points = resultsOf(rep).map((r) => ({ id: r.id, label: r.label, group: r.group }));
  document.title = `${shop} – Scanningsverktyg prototyp 1`;
  $("#app").innerHTML = `<article class="rp final" id="rp">

/* ---------- live view: the step list and the graph while the scan runs, or a replay ---------- */

let LV = null;

function stopLive() {
  if (!LV) return;
  LV.stopped = true;
  clearTimeout(LV.pollTimer); clearTimeout(LV.pumpTimer); clearInterval(LV.clock);
  window.removeEventListener("resize", LV.onResize);
  LV = null;
}

async function startLive(id, mode) {
  if (LV && LV.id === id && LV.mode === mode && !LV.stopped) return;
  stopLive();
  const lv = LV = { id, mode, S: newStats(), queue: [], next: 0, status: "running", points: [], results: {},
    busy: false, stopped: false, finished: false, speed: mode === "replay" ? 3 : 1, open: new Set() };
  let first, final = null;
  try {
    first = await api(`/api/scans/${encodeURIComponent(id)}/events?since=0`);
    if (mode === "replay") final = await api(`/api/scans/${encodeURIComponent(id)}`);
  } catch (e) { if (LV === lv) { stopLive(); renderMissing(id, e); } return; }
  if (LV !== lv) return;
  lv.points = first.points || [];
  lv.meta = {};
  lv.points.forEach((p) => (lv.meta[p.id] = p));
  lv.S.synthetic = !!first.synthetic;
  lv.shop = (final && final.shop) || first.shop || hostOf(first.url);
  lv.url = first.url;
  lv.clockAt = performance.now(); lv.clockBase = first.elapsed || 0;
  document.title = (mode === "replay" ? "Uppspelning: " : "Granskar ") + `${lv.shop} – Scanningsverktyg prototyp 1`;
  $("#app").innerHTML = `<article class="rp live" id="rp">
    <header class="rp-head"><div><h1>${esc(lv.shop)}</h1>
      <div class="meta"><span class="rp-state" id="rp-state">${mode === "replay" ? "Uppspelning" : "Granskning pågår"}</span> · <span class="num" id="rp-time">0 s</span> · ${esc(lv.url || "")}</div></div>
      ${mode === "replay" ? `<a class="btn-ghost" href="${base(id)}">Hoppa till rapporten</a>` : ""}</header>
    <div class="rp-line"><i id="rp-line" style="width:2%"></i></div>
    <p class="rp-sum" id="rp-sum" hidden></p>
    <div class="lv2" id="lv2">
      <section class="steps-box" aria-label="Granskningens steg"><ol class="steps2" id="steps" aria-live="polite"></ol>
        <p class="st-log" id="st-log"></p></section>
      <section class="gr-box" aria-label="Processen som graf">${graphFigure("gr-live")}</section>
    </div>
  </article>`;
  window.scrollTo(0, 0);
  const fig = document.getElementById("gr-live");
  lv.graph = new ProcessGraph(fig.querySelector("svg"), fig.querySelector(".gtip"));
  const stepsBox = document.getElementById("steps");
  stepsBox._refresh = () => draw(lv, true);
  lv.onResize = () => draw(lv, true);
  window.addEventListener("resize", lv.onResize);
  ingest(lv, first);
  draw(lv, true);
  lv.clock = setInterval(() => draw(lv, false), 1000);
  if (mode === "live" && lv.status === "running") poll(lv);
  pump(lv);
}

function ingest(lv, res) {
  lv.queue.push(...res.events);
  lv.next = res.next;
  lv.status = res.status;
  lv.error = res.error;
  if (res.elapsed != null) { lv.clockBase = res.elapsed; lv.clockAt = performance.now(); }
}

function poll(lv) {
  lv.pollTimer = setTimeout(async () => {
    if (lv.stopped) return;
    try { ingest(lv, await api(`/api/scans/${encodeURIComponent(lv.id)}/events?since=${lv.next}`)); } catch (e) {}
    if (lv.stopped) return;
    if (lv.status === "running") poll(lv);
    pump(lv);
  }, 800);
}

function liveNow(lv) {
  if (lv.mode === "replay" || lv.S.synthetic) return lv.S.t;
  return Math.max(lv.S.t, lv.clockBase + (performance.now() - lv.clockAt) / 1000);
}

/** Redraw the step list, numbers and (when `graph`) the graph from the stats. */
function draw(lv, graph) {
  if (lv.stopped) return;
  const now = lv.finished ? (lv.S.tDone != null ? lv.S.tDone : lv.S.t) : liveNow(lv);
  renderSteps(document.getElementById("steps"), stepsOf(lv.S, now, lv.finished), lv.open);
  const t = document.getElementById("rp-time");
  if (t) t.textContent = secs(now);
  const log = document.getElementById("st-log");
  if (log && !lv.finished) log.textContent = lv.S.log;
  const line = document.getElementById("rp-line");
  if (line) {
    const open = lv.S.phases.filter((p) => !(p.ends && p.end != null));  // overlapping phases: the earliest still running
    const ph = (open[0] || lv.S.phases[lv.S.phases.length - 1] || {}).name;
    const at = { sidor: 4 + Math.min(36, Object.keys(lv.S.pages).length * 1.2), produkter: 45, kassa: 60,
                 regler: 75 + 25 * Object.keys(lv.S.points).length / (lv.points.length || 45) }[ph] || 2;
    line.style.width = (lv.S.tDone != null ? 100 : at) + "%";
  }
  if (graph && lv.graph) lv.graph.update(lv.S, lv.points, lv.results);
}

function pump(lv) {
  if (lv.busy || lv.stopped) return;
  if (!lv.queue.length) {
    if (lv.status !== "running" || lv.mode === "replay") finishLive(lv);
    return;
  }
  lv.busy = true;
  const e = lv.queue.shift();
  let d = (LIVE_DELAY[e.type] != null ? LIVE_DELAY[e.type] : 60) / lv.speed;
  if (lv.mode === "live") d *= Math.max(0.15, Math.min(1, 12 / (lv.queue.length + 12)));
  if (RM) d = Math.min(d, 25);
  try {
    reduceStats(lv.S, e);
    if (e.type === "point") {
      const p = lv.meta[e.point] || {};
      lv.results[e.point] = { id: e.point, label: e.label || p.label, state: e.state };
    }
    draw(lv, e.type !== "log" && e.type !== "skip");
  } catch (err) { console.warn("live view:", err); }
  lv.pumpTimer = setTimeout(() => { lv.busy = false; pump(lv); }, d);
}

/** Done: the step list folds into one summary line and the finished report is built around it. */
async function finishLive(lv) {
  if (lv.finished || lv.stopped) return;
  lv.finished = true;
  clearInterval(lv.clock);
  let final = null;
  try { final = await api(`/api/scans/${encodeURIComponent(lv.id)}`); } catch (e) {}
  if (LV !== lv) return;
  if (!final || final.status === "failed" || lv.S.failed) { stopLive(); store.rendered = null; return renderFailed(final || { error: lv.S.failed }); }
  store.reports[lv.id] = final;
  await loadExtras(final, true);
  if (LV !== lv) return;
  if (!lv.S.synthetic || !store.stats[lv.id]) store.stats[lv.id] = lv.S;
  draw(lv, true);
  const st = document.getElementById("rp-state");
  if (st) st.textContent = "Klar";
  await new Promise((r) => setTimeout(r, RM ? 0 : 1100));
  if (LV !== lv) return;
  const box = document.getElementById("lv2"), sum = document.getElementById("rp-sum");
  if (sum) { sum.innerHTML = summaryLine(final, lv.S); sum.hidden = false; sum.classList.add("enter"); }
  if (box && !RM) {
    box.style.height = box.offsetHeight + "px";
    void box.offsetHeight;
    box.classList.add("settle");
    box.style.height = "0px";
    await new Promise((r) => setTimeout(r, 650));
  }
  if (LV !== lv) return;
  stopLive();
  renderReport(final);
  window.scrollTo(0, 0);
  store.rendered = lv.id;
  if (lv.mode === "replay") history.replaceState({ depth: 0 }, "", base(lv.id));
  markCurrent(parseRoute().point);
}

/* ---------- "Vad vi kontrollerar": Svensk Handels krav to the left, our 45 points to the right ---------- */

/** SH's numbered requirement a point belongs to: 3.2a → 3.2, 7.1f → 7.1, 2a → 2, 6.2b → 6.2. */
function reqOf(id) { return String(id).replace(/[a-f]$/, ""); }

  });
  const methods = data.methods || {};

  const filter = store.kravFilter || null;
  const pageOf = (r) => {
    const ps = [...new Set(r.points.map((p) => SH_PAGE[p.id]).filter(Boolean))];

  const card = (p, nested) => `<div class="kp${nested ? " nested" : ""}" data-pid="${esc(p.id)}" data-req="${esc(reqOf(p.id))}" data-method="${esc(p.method || "")}">
      <div class="kp-h"><span class="pidl">${esc(p.id)}</span> <b>${esc(p.label)}</b></div>
      <p class="kp-w">${esc(p.what || "")}</p>
      <dl class="kp-d">
        <div><dt>Metod</dt><dd>${esc(methods[p.method] || p.method || "–")}${p.how && p.how !== "–" ? ` <span class="muted">· ${esc(p.how)}</span>` : ""}</dd></div>
        <div><dt>Underlag</dt><dd>${esc(p.source || "–")}</dd></div>
        <div><dt>Utfall</dt><dd>${dot(OUTCOME_DOT[p.outcome])}${esc(outcomeTxt(p))}${OUTDATED[p.id] ? ` <span class="muted">· Svensk Handels krav föråldrat</span>` : ""}</dd></div>
      </dl></div>`;
  const bySec = (list, key) => {
    const g = {};
    list.forEach((x) => (g[key(x)] = g[key(x)] || []).push(x));
    return Object.keys(g).map(Number).sort((a, z) => a - z).map((s) => [s, g[s]]);
  };
  $("#app").innerHTML = `<article class="kv">
    <header class="kv-head">
      <h1>Vad vi kontrollerar</h1>
      <p class="kv-lead">Till vänster Svensk Handels krav för certifieringen Trygg E-handel, ordagrant ur
        <em>${esc(data.requirements_doc || SH_DOC)}</em>. Till höger våra 45 punkter: vad vi letar efter, hur och var.
        Linjerna visar vilken punkt som täcker vilket krav.</p>
      <p class="kv-sum">${BUCKETS.map(([k, label, os]) => `<span>${dot(OUTCOME_DOT[os[0]])}<span class="num">${count((p) => os.includes(p.outcome))}</span> ${label}</span>`).join("")}</p>
      <div class="kv-filter" role="group" aria-label="Filtrera på metod">
        <button type="button" class="chip" data-m="" aria-pressed="${!filter}">Alla<span class="n">${pts.length}</span></button>
        ${Object.keys(methods).filter((m) => count((p) => p.method === m)).map((m) =>
          `<button type="button" class="chip" data-m="${esc(m)}" aria-pressed="${filter === m}">${esc(methods[m])}<span class="n">${count((p) => p.method === m)}</span></button>`).join("")}
      </div>
    </header>
    <div class="kv-cols"><h2>Svensk Handels krav</h2><span></span><h2>Våra punkter</h2></div>
    <div class="kv-grid${filter ? " filtered" : ""}" id="kv-grid">
      <svg class="kv-lines" id="kv-lines" aria-hidden="true"></svg>
      ${bySec(reqs, (r) => r.sec).map(([s, rs]) => `
        <h3 class="kv-sec">${s}. ${esc(SECTIONS[s] || "")}</h3>

            ${[...new Set(r.points.map((p) => p.sh))].map((t) => `<p class="kr-t">”${esc(t)}”</p>`).join("")}

function applyKravFilter() {
  const f = store.kravFilter || null;
  const grid = document.getElementById("kv-grid");
  if (!grid) return;
  grid.classList.toggle("filtered", !!f);
  grid.querySelectorAll(".kp").forEach((el) => el.classList.toggle("match", !f || el.dataset.method === f));
  grid.querySelectorAll(".kr").forEach((el) => el.classList.toggle("match", !f || !!el.querySelector(`.kp.nested[data-method="${CSS.escape(f)}"]`)));
  document.querySelectorAll(".kv-filter .chip").forEach((c) => c.setAttribute("aria-pressed", String((c.dataset.m || null) === f)));
  drawKravLines();
}

function drawKravLines() {
  const grid = document.getElementById("kv-grid"), svg = document.getElementById("kv-lines");
  if (!grid || !svg) return;
  const g = grid.getBoundingClientRect();
  const anyPts = grid.querySelector(".kv-pts");
  if (!anyPts || getComputedStyle(svg).display === "none" || getComputedStyle(anyPts).display === "none") { svg.innerHTML = ""; return; }
  const kr0 = grid.querySelector(".kr"), x0 = kr0.getBoundingClientRect().right - g.left + 4, x1 = anyPts.getBoundingClientRect().left - g.left - 4;
  svg.setAttribute("viewBox", `0 0 ${g.width} ${g.height}`);
  svg.style.height = g.height + "px";
  const f = store.kravFilter || null;
  let html = "";
  grid.querySelectorAll(".kv-pts .kp").forEach((p) => {
    const req = grid.querySelector(`.kr[data-req="${CSS.escape(p.dataset.req)}"]`);
    if (!req) return;
    const a = req.getBoundingClientRect(), b = p.getBoundingClientRect();
    const y0 = a.top - g.top + 14, y1 = b.top - g.top + 14, m = (x0 + x1) / 2;
    const on = !f || p.dataset.method === f;
    html += `<path d="M${x0},${y0} C${m},${y0} ${m},${y1} ${x1},${y1}" data-pid="${esc(p.dataset.pid)}" data-req="${esc(p.dataset.req)}" class="${on ? "" : "off"}"></path>`
          + `<circle cx="${x0}" cy="${y0}" r="2.2"></circle><circle cx="${x1}" cy="${y1}" r="2.2"></circle>`;
  });
  svg.innerHTML = html;
}

function kravFocus(req, pid) {
  const grid = document.getElementById("kv-grid");
  if (!grid) return;
  if (!req && !pid) {
    grid.classList.remove("focus");
    grid.querySelectorAll(".hi").forEach((e) => e.classList.remove("hi"));
    return;
  }
  grid.classList.add("focus");
  const pids = pid ? [pid] : [...grid.querySelectorAll(`.kv-pts .kp[data-req="${CSS.escape(req)}"]`)].map((e) => e.dataset.pid);
  const r = req || reqOf(pid);
  grid.querySelectorAll(".kr, .kv-pts .kp, .kv-lines path").forEach((e) => {
    const hit = e.classList.contains("kr") ? e.dataset.req === r : pids.includes(e.dataset.pid);
    e.classList.toggle("hi", hit);
  });
}

function wireKrav() {
  const grid = document.getElementById("kv-grid");
  document.querySelectorAll(".kv-filter .chip").forEach((c) => c.addEventListener("click", () => {
    store.kravFilter = c.dataset.m || null;
    applyKravFilter();
  }));
  let pinned = null;
  const target = (e) => {
    const p = e.target.closest(".kv-pts .kp"), r = e.target.closest(".kr");
    if (window.innerWidth <= 860) return null;
    return p ? [null, p.dataset.pid] : r ? [r.dataset.req, null] : null;
  };
  grid.addEventListener("mouseover", (e) => { if (!pinned) { const t = target(e); if (t) kravFocus(...t); } });
  grid.addEventListener("mouseleave", () => { if (!pinned) kravFocus(null, null); });
  grid.addEventListener("click", (e) => {
    const t = target(e);
    const key = t ? t.join("|") : null;
    pinned = key && key !== pinned ? key : null;
    if (pinned) kravFocus(...t); else kravFocus(null, null);
  });
  grid.addEventListener("focusin", (e) => { const t = target(e); if (t) kravFocus(...t); });
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => { if (grid.isConnected) drawKravLines(); else ro.disconnect(); });
    ro.observe(grid);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawKravLines());
}

/* ---------- review mode: decide every point with the evidence in view ---------- */

const DECISIONS = [["brist", "Brist", "b"], ["uppfyllt", "Uppfyllt", "u"], ["osäker", "Osäker", "o"],
                   ["ej tillämplig", "Ej tillämplig", "e"], ["kräver underlag", "Kräver underlag", "k"]];
const SUGGEST = { "brist": "brist", "uppfyllt": "uppfyllt", "osäker": "osäker", "råd": "osäker", "ej tillämplig": "ej tillämplig",
                  "kräver intyg": "kräver underlag", "kräver testköp": "kräver underlag" };

function reviewOf(id) { return store.review[id] || { decisions: {}, decided: 0, total: 45, complete: false, reviewer: "" }; }
function decisionOf(id, pid) { return ((reviewOf(id).decisions || {})[pid] || {}); }
function reviewerName() {
  try { return localStorage.getItem("villkorskollen.reviewer") || ""; } catch (e) { return ""; }
}
function rememberReviewer(n) { try { localStorage.setItem("villkorskollen.reviewer", n); } catch (e) {} }

/** Banner on the report: preliminary until every point is decided, then links to the final report. */
function prelimHtml(rep) {
  if (rep.id === "demo") return "";
  const rev = reviewOf(rep.id);
  const b = base(rep.id);
  if (rev.complete) return `<div class="prelim done"><div><b>Granskad</b> av ${esc(rev.reviewer || "–")}, ${esc(fmtDate(rev.updated))}.
      ${rev.changed ? `Granskaren ändrade verktygets förslag på ${plural(rev.changed, "punkt", "punkter")}.` : "Granskaren behöll verktygets förslag."}</div>
    <div class="prelim-a"><a class="btn" href="/api/scans/${encodeURIComponent(rep.id)}/report.pdf" target="_blank" rel="noopener">Slutrapport (PDF)</a>
      <a class="btn-ghost" href="/api/scans/${encodeURIComponent(rep.id)}/report.html" target="_blank" rel="noopener">Utskriftsversion</a>
      <a class="btn-ghost" href="${b}/granska">Ändra beslut</a></div></div>`;
  return `<div class="prelim"><div><b>Preliminär – ej granskad.</b> ${rev.decided ? `${rev.decided} av ${rev.total} punkter granskade.` : ""}
      Det här är verktygets förslag. En granskare går igenom varje punkt med underlaget innan slutrapporten kan skapas.</div>
    <div class="prelim-a"><a class="btn" href="${b}/granska">${rev.decided ? "Fortsätt granskningen" : "Granska alla punkter"}</a></div></div>`;
}

function reviewOrder(rep) { return resultsOf(rep).map((r) => r.id); }

function shownInList(rep, pid) {
  const d = decisionOf(rep.id, pid);
  if (store.rvOpen && d.decision) return false;
  if (store.rvChanged && !d.changed) return false;
  return true;
}

function nextPid(rep, pid, step) {
  const order = reviewOrder(rep);
  let i = order.indexOf(pid);
  for (let k = 0; k < order.length; k++) {
    i += step;
    if (i < 0 || i >= order.length) return null;
    if (shownInList(rep, order[i])) return order[i];
  }
  return null;
}

function listHtml(rep, pid) {
  const bySec = {};
  resultsOf(rep).forEach((r) => (bySec[sectionOf(r.id)] = bySec[sectionOf(r.id)] || []).push(r));
  const b = base(rep.id);
  return Object.keys(bySec).map(Number).sort((a, z) => a - z).map((s) => {
    const rows = bySec[s].filter((r) => shownInList(rep, r.id) || r.id === pid);
    if (!rows.length) return "";
    return `<li class="rv-sec">${s}. ${esc(SECTIONS[s] || "")}</li>` + rows.map((r) => {
      const d = decisionOf(rep.id, r.id);
      return `<li><a href="${b}/granska/${encodeURIComponent(r.id)}" class="${r.id === pid ? "cur" : ""}" data-pid="${esc(r.id)}">

}

/** Fill each quote's page text, with the quote marked and scrolled into the middle of its box. */
async function fillQuotes(rep, r) {
  for (const box of document.querySelectorAll(".rv-text")) {
    const e = (r.evidence || [])[Number(box.dataset.k)];
    let page;
    try { page = await getPage(rep, Number(box.dataset.page)); } catch (err) { box.innerHTML = `<p class="error">Kunde inte hämta sidan.</p>`; continue; }
    if (!box.isConnected) return;
    const text = page.text || "";
    const span = locate(text, e.quote);
    box.innerHTML = span ? renderText(text, span) : `<p><mark>${esc(e.quote)}</mark></p><p class="small muted">Citatet kunde inte hittas exakt i sidans text.</p>`;
    const mk = box.querySelector("mark");
    if (mk) box.scrollTop = mk.offsetTop - box.clientHeight / 2 + mk.offsetHeight / 2;
  }
}

async function renderReview(rep, pid) {
  if (!store.method) { try { store.method = await api("/api/method"); } catch (e) { store.method = { points: [], methods: {} }; } }
  const order = reviewOrder(rep);
  if (!pid || !order.includes(pid)) {
    pid = order.find((id) => !decisionOf(rep.id, id).decision) || order[0];
    history.replaceState({ depth: 0 }, "", `${base(rep.id)}/granska/${encodeURIComponent(pid)}`);
  }
  const r = findResult(rep, pid);
  const shop = rep.shop || hostOf(rep.url);
  document.title = `Granska ${r.id} – ${shop} – Scanningsverktyg prototyp 1`;
  const rev = reviewOf(rep.id);
  $("#app").innerHTML = `<article class="rv" id="rv">
    <header class="rv-head">
      <div><a class="back" href="${base(rep.id)}">← Preliminär rapport</a><h1>Granskning: ${esc(shop)}</h1></div>
      <div class="rv-prog" id="rv-prog">${progressHtml(rep)}</div>
    </header>
    <div id="rv-done">${rev.complete ? doneHtml(rep) : ""}</div>
    <div class="rv-grid">
      <nav class="rv-side" aria-label="Alla punkter"><details class="rv-listbox" id="rv-listbox"><summary>Alla punkter</summary>
        <div class="rv-filters"><label><input type="checkbox" id="rv-f-open"${store.rvOpen ? " checked" : ""}> Visa bara obeslutade</label>
          <label><input type="checkbox" id="rv-f-ch"${store.rvChanged ? " checked" : ""}> Visa där granskaren ändrat förslaget</label></div>
        <ul class="rv-list" id="rv-list">${listHtml(rep, pid)}</ul></details></nav>
      <section class="rv-ev" aria-label="Underlag">${evidenceHtml(rep, r)}</section>
      <aside class="rv-dec" aria-label="Beslut" id="rv-dec" data-pid="${esc(r.id)}">${decisionHtml(rep, r)}</aside>
    </div></article>`;
  const lb = document.getElementById("rv-listbox");
  if (window.innerWidth > 860) lb.open = true;
  const cur = document.querySelector(".rv-list a.cur");
  if (cur && lb.open) cur.scrollIntoView({ block: "center" });
  window.scrollTo(0, 0);
  wireReview(rep, r);

}

function doneHtml(rep) {
  return `<div class="prelim done"><div><b>Alla punkter är granskade.</b> Slutrapporten kan skapas.</div>
    <div class="prelim-a"><a class="btn" href="/api/scans/${encodeURIComponent(rep.id)}/report.pdf" target="_blank" rel="noopener">Slutrapport (PDF)</a>
    <a class="btn-ghost" href="/api/scans/${encodeURIComponent(rep.id)}/report.html" target="_blank" rel="noopener">Utskriftsversion</a></div></div>`;
}

function refreshChrome(rep, pid) {
  const p = document.getElementById("rv-prog");
  if (p) p.innerHTML = progressHtml(rep);
  const l = document.getElementById("rv-list");
  if (l) l.innerHTML = listHtml(rep, pid);
  const dn = document.getElementById("rv-done");
  if (dn) dn.innerHTML = reviewOf(rep.id).complete ? doneHtml(rep) : "";
}

async function saveDecision(rep, r, patch) {
  const msg = document.getElementById("rv-msg");
  const name = (document.getElementById("rv-name") || {}).value || "";
  if (!name.trim()) {
    if (msg) { msg.className = "small error rv-msg"; msg.textContent = "Skriv ditt namn som granskare först."; }
    const n = document.getElementById("rv-name");
    if (n) n.focus();
    return false;
  }
  rememberReviewer(name.trim());
  // the form's fields belong to this point only while its panel is on screen
  const mine = (document.getElementById("rv-dec") || {}).dataset && document.getElementById("rv-dec").dataset.pid === r.id;
  const body = Object.assign({ reviewer: name.trim() }, mine ? { comment: document.getElementById("rv-comment").value,
    atgard: document.getElementById("rv-atgard").value } : {}, patch);
  try {
    if (msg) { msg.className = "small muted rv-msg"; msg.textContent = "Sparar…"; }
    store.review[rep.id] = await api(`/api/scans/${encodeURIComponent(rep.id)}/review/${encodeURIComponent(r.id)}`,
      { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (msg && document.getElementById("rv-msg") === msg) msg.textContent = `Sparat ${fmtDate(decisionOf(rep.id, r.id).saved)}`;
    refreshChrome(rep, r.id);
    return true;
  } catch (e) {
    if (msg) { msg.className = "small error rv-msg"; msg.textContent = `Kunde inte spara: ${e.message}`; }
    return false;
  }
}

function setChoice(rep, r, v) {
  document.querySelectorAll(".rv-c").forEach((b) => { const on = b.dataset.v === v; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
  document.getElementById("rv-atgard-box").hidden = v !== "brist";
  document.getElementById("rv-need-box").hidden = v !== "kräver underlag";
  return saveDecision(rep, r, { decision: v });
}

function go(rep, pid) { if (pid) location.hash = `${base(rep.id)}/granska/${encodeURIComponent(pid)}`; }

function wireReview(rep, r) {
  document.querySelectorAll(".rv-c").forEach((b) => b.addEventListener("click", () => setChoice(rep, r, b.dataset.v)));
  clearTimeout(store.rvTimer);
  const later = () => { clearTimeout(store.rvTimer); store.rvTimer = setTimeout(() => { if (decisionOf(rep.id, r.id).decision) saveDecision(rep, r, {}); }, 800); };
  ["rv-comment", "rv-atgard"].forEach((id) => document.getElementById(id).addEventListener("input", later));
  document.getElementById("rv-name").addEventListener("change", (e) => rememberReviewer(e.target.value.trim()));
  document.getElementById("rv-prev").addEventListener("click", () => go(rep, nextPid(rep, r.id, -1)));
  const next = async () => {
    clearTimeout(store.rvTimer);
    if (!decisionOf(rep.id, r.id).decision) {
      const msg = document.getElementById("rv-msg");
      msg.className = "small error rv-msg"; msg.textContent = "Välj ett beslut först.";
      return;
    }
    if (!(await saveDecision(rep, r, {}))) return;
    const n = nextPid(rep, r.id, 1) || reviewOrder(rep).find((id) => !decisionOf(rep.id, id).decision);
    if (n && n !== r.id) go(rep, n);
    else document.getElementById("rv-done").scrollIntoView({ behavior: RM ? "auto" : "smooth" });
  };
  document.getElementById("rv-next").addEventListener("click", next);
  const own = () => (decisionOf(rep.id, r.id).evidence || []).slice();
  document.getElementById("rv-add").addEventListener("click", async () => {
    const url = document.getElementById("rv-url").value.trim(), quote = document.getElementById("rv-quote").value.trim();
    const msg = document.getElementById("rv-msg");
    if (!/^https?:\/\//i.test(url)) { msg.className = "small error rv-msg"; msg.textContent = "Ange en adress som börjar med https://."; return; }
    if (await saveDecision(rep, r, { evidence: own().concat([{ url, quote }]) })) renderDecision(rep, r);
  });
  document.querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", async () => {
    const ev = own(); ev.splice(Number(b.dataset.rm), 1);
    if (await saveDecision(rep, r, { evidence: ev })) renderDecision(rep, r);
  }));
  const f = document.getElementById("intygform");
  if (f) f.addEventListener("submit", (e) => submitIntyg(e, rep, r));
  ["rv-f-open", "rv-f-ch"].forEach((id) => document.getElementById(id).addEventListener("change", (e) => {
    if (id === "rv-f-open") store.rvOpen = e.target.checked; else store.rvChanged = e.target.checked;
    document.getElementById("rv-list").innerHTML = listHtml(rep, r.id);
  }));
  store.rvKeys = (e) => {
    if (parseRoute().review !== true || e.ctrlKey || e.metaKey || e.altKey) return;
    const dec = document.getElementById("rv-dec");
    if (!dec || dec.dataset.pid !== r.id) return;  // the next point is still loading
    const tag = (e.target.tagName || "").toLowerCase();
    const typing = tag === "textarea" || tag === "input" || tag === "select" || e.target.isContentEditable;
    if (typing) return;
    const k = e.key.toLowerCase();
    const hit = DECISIONS.find((d) => d[2] === k);
    if (hit) { e.preventDefault(); setChoice(rep, r, hit[0]); }
    else if (e.key === "Enter" && !(tag === "button" || tag === "a")) { e.preventDefault(); next(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); go(rep, nextPid(rep, r.id, 1)); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(rep, nextPid(rep, r.id, -1)); }
  };
}

function renderDecision(rep, r) {
  const box = document.getElementById("rv-dec");
  if (!box) return;
  box.innerHTML = decisionHtml(rep, r);
  wireReview(rep, r);
}

document.addEventListener("keydown", (e) => { if (store.rvKeys) store.rvKeys(e); });
