<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanningsverktyg prototyp 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f6f3; --surface: #ffffff; --surface-2: #f0efea; --line: #dddcd5; --line-strong: #c4c2b9;
  --text: #1d1f21; --muted: #5d6166; --faint: #8a8e93; --accent: #24527a; --accent-bg: #e6eef5;
  --brist: #b42318; --brist-bg: #fdecea; --osaker: #a15c07; --osaker-bg: #fdf3e1;
  --ok: #1f7a3f; --ok-bg: #e7f4ec; --grey: #6b7075; --grey-bg: #eceeef;
  --rad: #0b6e86; --rad-bg: #e1f2f6; --na: #4a5f86; --na-bg: #e7ebf4; --kik: #6b6560; --kik-bg: #efece8;
  --intyg: #6a46a8; --intyg-bg: #efe9f8; --test: #9a3f74; --test-bg: #f8e8f1;
  --mark: #ffe58a; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
  --scrim: rgba(20,22,25,.35);
  --sans: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Source Serif 4", Georgia, serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --surface: #1d2024; --surface-2: #24282d; --line: #31353b; --line-strong: #454a51;
    --text: #e8e9ea; --muted: #a6abb1; --faint: #7d838a; --accent: #8fb8de; --accent-bg: #1f2d3a;
    --brist: #f2877c; --brist-bg: #3a1f1d; --osaker: #e9b45a; --osaker-bg: #382c17;
    --ok: #74c992; --ok-bg: #1b3325; --grey: #9aa0a6; --grey-bg: #2a2e33;
    --rad: #6ccbe0; --rad-bg: #16323a; --na: #a3b4d6; --na-bg: #232a38; --kik: #b3aca5; --kik-bg: #2d2a27;
    --intyg: #b9a0e8; --intyg-bg: #2b2340; --test: #e59ac6; --test-bg: #3a2131;
    --mark: #6b5a12; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    --scrim: rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); }
a { color: var(--accent); }
h1, h2, h3, h4 { line-height: 1.25; margin: 0; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
.topbar { border-bottom: 1px solid var(--line); background: var(--surface); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 52px; gap: 12px; }
.brand { font-weight: 700; font-size: 17px; color: var(--text); text-decoration: none; letter-spacing: -.01em; }
.brand span { color: var(--accent); }
.toplink { font-size: 14px; color: var(--muted); text-decoration: none; }
.toplink:hover { color: var(--text); }
main { padding: 32px 0 64px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.btn { background: var(--accent); color: var(--surface); border: 0; border-radius: 6px; padding: 10px 18px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .6; cursor: default; }
.btn-ghost { background: none; border: 1px solid var(--line-strong); color: var(--text); border-radius: 6px; padding: 6px 12px; cursor: pointer; text-decoration: none; font-size: 14px; display: inline-block; }
.btn-ghost:hover { background: var(--surface-2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.error { color: var(--brist); }

/* Start */
.hero { max-width: 640px; margin: 24px auto 40px; }
.hero h1 { font-size: 34px; letter-spacing: -.02em; }
.hero p { font-size: 18px; color: var(--muted); margin: 8px 0 24px; }
.urlform { display: flex; gap: 8px; }
.urlform input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); }
.urlform input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.recent { max-width: 640px; margin: 0 auto; }
.recent h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
.scanlist { list-style: none; margin: 0; padding: 0; }
.scanlist a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; text-decoration: none; color: var(--text); border-bottom: 1px solid var(--line); }
.scanlist li:last-child a { border-bottom: 0; }
.scanlist a:hover { background: var(--surface-2); }
.scanlist .shop { font-weight: 600; }
.scanlist .meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.scanlist .right { text-align: right; flex-shrink: 0; font-size: 13px; }
.scanlist .shop { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nowrap { white-space: nowrap; }

/* Progress */
.progress { max-width: 640px; margin: 24px auto; }
.progress h1 { font-size: 24px; }
.steps { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
.step { font-size: 14px; padding: 6px 10px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.step.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.loglines { list-style: none; margin: 0; padding: 16px; font: 14px/1.6 var(--mono); }
.loglines li { color: var(--muted); overflow-wrap: anywhere; }
.loglines li:last-child { color: var(--text); }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Report */
.rhead { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 20px; }
.rhead h1 { font-size: 30px; letter-spacing: -.02em; overflow-wrap: anywhere; }
.rhead .meta { font-size: 14px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
.summary { padding: 20px; margin-bottom: 28px; }
.verdict { font-size: 20px; font-weight: 600; margin-bottom: 14px; }
.bar { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.bar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 12px; font-size: 14px; }
.legend b { font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.s-brist { --c: var(--brist); --cb: var(--brist-bg); }
.s-osaker { --c: var(--osaker); --cb: var(--osaker-bg); }
.s-ok { --c: var(--ok); --cb: var(--ok-bg); }
.s-grey { --c: var(--grey); --cb: var(--grey-bg); }
.s-rad { --c: var(--rad); --cb: var(--rad-bg); }
.s-na { --c: var(--na); --cb: var(--na-bg); }
.s-kik { --c: var(--kik); --cb: var(--kik-bg); }
.s-intyg { --c: var(--intyg); --cb: var(--intyg-bg); }
.s-test { --c: var(--test); --cb: var(--test-bg); }
.fill { background: var(--c); }
.fill.s-kik { background: repeating-linear-gradient(135deg, var(--kik) 0 3px, var(--kik-bg) 3px 6px); }
.pill.s-kik { border: 1px dashed var(--kik); padding: 1px 7px; }
.legend .sep { flex-basis: 100%; height: 0; }
.legend .outside { color: var(--muted); }
.trust { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.trust::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 2px solid currentColor; }
.trust.t-oss { color: var(--accent); } .trust.t-oss::before { background: currentColor; }
.trust.t-doc { color: var(--ok); } .trust.t-doc::before { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.trust.t-egen { color: var(--intyg); }
.trust.t-none { color: var(--faint); } .trust.t-none::before { border-style: dashed; }
.oldreq { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: var(--grey-bg); color: var(--muted); border: 1px solid var(--line-strong); white-space: nowrap; }
.need { margin-bottom: 36px; }
.need h3 { font-size: 15px; font-weight: 600; padding: 0 0 6px; color: var(--muted); }
.need .rows a { grid-template-columns: 130px 56px 1fr auto; }
.shref { font-size: 13px; color: var(--muted); margin-top: 6px; }
.shot { display: block; margin: 8px 0; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; }
details.shotbox summary { cursor: pointer; font-size: 13px; color: var(--accent); }
.evmeta { font-size: 13px; color: var(--muted); margin-bottom: 6px; overflow-wrap: anywhere; }
.form label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
.form .q { font-size: 16px; margin: 0 0 8px; }
.form .yn { display: flex; gap: 16px; }
.form .yn label { font-weight: 400; margin: 0; display: flex; gap: 6px; align-items: center; font-size: 15px; }
.form textarea { width: 100%; min-height: 72px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); font: inherit; color: inherit; }
.form input[type=file] { font-size: 14px; }
.form .actions { margin-top: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.saved { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; font-size: 15px; }
.saved p { margin: 0 0 6px; }
.saved blockquote { margin: 4px 0 8px; font: italic 14px/1.5 var(--serif); padding-left: 10px; border-left: 2px solid var(--line-strong); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: var(--c); background: var(--cb); white-space: nowrap; }
.tabs { display: flex; gap: 4px; box-shadow: inset 0 -1px var(--line); margin-bottom: 24px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; scroll-margin-top: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { padding: 10px 14px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs a.on { color: var(--text); border-bottom-color: var(--accent); }
.sect-title { font-size: 20px; margin: 0 0 4px; }
.sect-sub { font-size: 14px; color: var(--muted); margin: 0 0 14px; }
.fixes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-bottom: 36px; }
.fix { display: block; padding: 16px; text-decoration: none; color: var(--text); border-left: 3px solid var(--brist); }
.fix:hover { box-shadow: var(--shadow); }
.fix .top { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
.pid { font: 600 13px var(--mono); color: var(--muted); }
.fix h3 { font-size: 16px; }
.fix p { margin: 4px 0 10px; font-size: 15px; }
.fix blockquote { margin: 0; font: italic 14px/1.5 var(--serif); color: var(--muted); padding-left: 10px; border-left: 2px solid var(--line-strong); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip .n { color: var(--faint); margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.group { margin-bottom: 20px; }
.group h3 { font-size: 15px; font-weight: 600; padding: 0 0 6px; color: var(--muted); }
.group h3 b { color: var(--text); }
.rows { list-style: none; margin: 0; padding: 0; }
.rows a { display: grid; grid-template-columns: 170px 56px 1fr; gap: 12px; align-items: baseline; padding: 10px 16px; text-decoration: none; color: var(--text); border-bottom: 1px solid var(--line); }
.rows li:last-child a { border-bottom: 0; }
.rows a:hover, .rows a.cur { background: var(--surface-2); }
.rows .lbl { font-weight: 600; }
.rows .sum { color: var(--muted); font-size: 15px; }
.empty { padding: 16px; color: var(--muted); }
table.pages { width: 100%; border-collapse: collapse; font-size: 15px; }
.pages th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.pages td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.pages tr:last-child td { border-bottom: 0; }
.kind { font: 13px var(--mono); color: var(--muted); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--grey-bg); color: var(--grey); margin-left: 4px; }
.about { max-width: 720px; }
.about h2 { font-size: 20px; margin: 28px 0 8px; }
.about h2:first-child { margin-top: 0; }
.about p { margin: 0 0 12px; }
.groups { list-style: none; margin: 0; padding: 0; }
.groups li { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.groups li:last-child { border-bottom: 0; }
.groups .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.groups .d { grid-column: 1 / -1; color: var(--muted); font-size: 15px; }

/* Panel */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 10; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 11; overflow-y: auto; box-shadow: var(--shadow); border-left: 1px solid var(--line); }
.panel[hidden], .scrim[hidden] { display: none; }
.phead { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; z-index: 1; }
.phead h2 { font-size: 20px; overflow-wrap: anywhere; }
.phead .sub { margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.close { background: none; border: 0; font-size: 24px; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 6px; }
.close:hover { color: var(--text); }
.close:focus { outline: none; }
.close:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.pbody { padding: 20px; }
.pbody section { margin-bottom: 24px; }
.pbody h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.sh { margin: 0; font: italic 17px/1.55 var(--serif); padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--accent-bg); border-radius: 0 6px 6px 0; }
.sh::before { content: "\201D"; } .sh::after { content: "\201D"; }
.why { margin: 8px 0 0; }
.ev { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
.ev .role { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--c); }
.ev blockquote { margin: 6px 0 8px; font: 15px/1.55 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; }
.ev .links { font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.ev .url { color: var(--muted); overflow-wrap: anywhere; }
.plist { list-style: none; margin: 0; padding: 0; font-size: 15px; }
.plist li { padding: 6px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.plist li:last-child { border-bottom: 0; }
.note { background: var(--grey-bg); border-radius: 8px; padding: 12px 14px; font-size: 15px; }
.back { display: inline-block; font-size: 14px; margin-bottom: 4px; text-decoration: none; }
.pagetext { font: 15px/1.6 var(--serif); overflow-wrap: anywhere; }
.pagetext p { margin: 0 0 6px; }
.pagetext h4 { font: 600 17px/1.3 var(--sans); margin: 18px 0 6px; }
.pagetext mark { background: var(--mark); color: inherit; padding: 1px 0; border-radius: 2px; box-shadow: 0 0 0 2px var(--mark); }
.hit { font-size: 14px; padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; }
.hit.ok { background: var(--ok-bg); color: var(--ok); }
.hit.miss { background: var(--osaker-bg); color: var(--osaker); }

/* ---------- Black and white theme (overrides the tokens above, also in dark mode) ---------- */
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f4f4f4; --line: #e3e3e3; --line-strong: #c8c8c8;
  --text: #111111; --muted: #555555; --faint: #8a8a8a; --accent: #111111; --accent-bg: #f4f4f4;
  --brist: #111111; --brist-bg: #f4f4f4; --osaker: #111111; --osaker-bg: #f4f4f4;
  --ok: #555555; --ok-bg: #f4f4f4; --grey: #777777; --grey-bg: #f4f4f4;
  --rad: #333333; --rad-bg: #f4f4f4; --na: #777777; --na-bg: #f4f4f4; --kik: #777777; --kik-bg: #f4f4f4;
  --intyg: #333333; --intyg-bg: #f4f4f4; --test: #333333; --test-bg: #f4f4f4;
  --mark: #e6e6e6; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.06); --scrim: rgba(0,0,0,.25);
  --serif: var(--sans);
  color-scheme: light;
}
body { font-size: 16px; }
a { color: var(--text); text-underline-offset: 2px; }
.topbar { background: #fff; }
.btn { background: #111; color: #fff; border-radius: 4px; }
.btn-ghost { border-radius: 4px; }
.sh { font: 16px/1.6 var(--sans); font-style: normal; background: var(--surface-2); border-left-color: #111; }
.ev { border-color: var(--line); }
.ev .role { color: var(--muted); }
.ev blockquote, .saved blockquote, .pagetext { font: 16px/1.6 var(--sans); font-style: normal; }
.pagetext mark { background: none; box-shadow: none; text-decoration: underline 2px; text-underline-offset: 3px; font-weight: 600; }
.pill { background: none; padding: 0; color: var(--text); font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; border: 0 !important; }
.pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; box-sizing: border-box; flex: none; }
.pill.s-brist::before, .d-brist { background: #111; }
.pill.s-osaker::before, .d-osaker { border: 1.5px solid #111; }
.pill.s-ok::before, .d-ok { background: #c9c9c9; }
.pill.s-na::before, .d-na { border: 1.5px solid #c9c9c9; }
.pill.s-rad::before, .d-rad { background: #777; }
.pill.s-kik::before, .d-kik { border: 1.5px dashed #9a9a9a; }
.pill.s-intyg::before, .pill.s-test::before, .d-need { border: 1.5px dotted #555; }
.d-wait { background: #ececec; transform: scale(.55); }
.trust, .oldreq { color: var(--muted) !important; }

/* ---------- Report, also while the scan runs ---------- */
.rp { --w: 70ch; }
.rp-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.rp-head h1 { font-size: 30px; letter-spacing: -.02em; font-weight: 700; overflow-wrap: anywhere; }
.rp-head .meta { font-size: 14px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
.rp-state { font-weight: 600; color: var(--text); }
.rp-line { height: 2px; background: var(--line); margin: 18px 0 0; overflow: hidden; }
.rp-line i { display: block; height: 100%; background: #111; width: 0; transition: width .8s ease; }
.rp.final .rp-line i { background: var(--line); }
.rp-keys { display: flex; flex-wrap: wrap; gap: 4px 28px; margin: 12px 0 0; font-size: 13px; color: var(--muted); }
.rp-keys div { display: flex; align-items: baseline; gap: 6px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--text); }
.rp-keys .num { font-size: 15px; }
.rp-lead { font-size: 20px; line-height: 1.5; max-width: 60ch; margin: 28px 0 22px; }
.rp-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px 22px; padding: 18px 0 20px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.rp-map h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
.rp-map ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.rp-map a { display: inline-flex; align-items: center; gap: 5px; font: 12px var(--mono); color: var(--muted); text-decoration: none; }
.rp-map a:hover { color: var(--text); text-decoration: underline; }
.rp-map a.cur { color: var(--text); font-weight: 600; }
.d { width: 9px; height: 9px; border-radius: 50%; box-sizing: border-box; display: inline-block; flex: none; transition: transform .35s cubic-bezier(.3,1.5,.5,1); }

.rp-sec { margin: 44px 0 0; }

.rl a { display: block; padding: 12px 0; text-decoration: none; color: var(--text); }
.rl a:hover .t, .rl a.cur .t { text-decoration: underline; }
.rl .t { display: block; font-size: 16.5px; line-height: 1.5; }
.rl .m { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }

details.rp-fold + details.rp-fold { border-top: 0; }

details.rp-fold[open] > summary::after { content: "Dölj"; }

details.rp-fold .sub { color: var(--muted); margin: 0 0 8px; }
.enter { animation: rpIn .45s cubic-bezier(.2,.8,.2,1) both; }

/* summary line, step list and process graph */
.rp-sum { margin: 12px 0 0; font-size: 14px; color: var(--muted); line-height: 1.7; }
.rp-sum .num { font-size: 14px; }
.rp-sum .ok { color: var(--text); font-weight: 600; }
.lv2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 32px; margin-top: 22px; align-items: start; overflow: hidden;
  transition: height .6s ease, opacity .6s ease; }
.lv2.settle { opacity: 0; }
.steps2 { list-style: none; margin: 0; padding: 0; counter-reset: st; }
.st { border-top: 1px solid var(--line); }
.st:last-child { border-bottom: 1px solid var(--line); }
.st.enter { animation: rpIn .4s cubic-bezier(.2,.8,.2,1) both; }
.st-h { width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; grid-template-areas: "i t time" ". n n"; gap: 2px 10px;
  align-items: baseline; padding: 11px 0 10px; background: none; border: 0; text-align: left; cursor: pointer; color: var(--text); }
.st-h:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
.st-i { grid-area: i; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: inline-flex;
  align-items: center; justify-content: center; font-size: 11px; line-height: 1; align-self: center; box-sizing: border-box; }
.st-done .st-i { background: #111; border-color: #111; color: #fff; }
.st-skipped .st-i, .st-failed .st-i { border-color: #999; color: #555; }
.st-running .st-i { border-color: var(--line); border-top-color: #111; animation: spin .9s linear infinite; }
.st-t { grid-area: t; font-weight: 600; font-size: 15.5px; }
.st-waiting .st-t { color: var(--faint); font-weight: 500; }
.st-n { grid-area: n; font-size: 14px; color: var(--muted); }
.st-n .num { font-size: 14px; }
.st-time { grid-area: time; font-size: 13px; color: var(--muted); }
.st-d { padding: 0 0 0 32px; }
.st-d:empty { display: none; }
.st-sub { font-size: 13px; color: var(--muted); margin: -4px 0 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.st-sub .d { margin-right: 4px; }
.st-lines { list-style: none; margin: 0 0 10px; padding: 0; font-size: 13px; }
.st-lines li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 2px 0; animation: rpIn .3s both; }
.st-lines .a { font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-lines .b { color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22ch; }
.st-lines li.sk { color: var(--faint); }
.st-lines li.sk .a { text-decoration: line-through; text-decoration-color: #bbb; }
.st[data-key="regler"] .st-lines li, .st[data-key="kassa"] .st-lines li { grid-template-columns: auto minmax(0, 1fr); }
.st[data-key="regler"] .st-lines .b, .st[data-key="kassa"] .st-lines .b { max-width: none; text-align: left; }
.st-more { font-size: 12px; color: var(--faint); margin: -4px 0 10px; }
.st-shots { display: flex; gap: 8px; margin: 0 0 10px; overflow-x: auto; }
.st-shots figure { margin: 0; flex: 0 0 104px; animation: rpIn .4s both; }
.st-shots img { width: 104px; height: 66px; object-fit: cover; object-position: top; border: 1px solid var(--line); border-radius: 3px; display: block; filter: grayscale(1); }
.st-shots figcaption { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-log { font: 12px var(--mono); color: var(--faint); margin: 10px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gr { position: relative; margin: 0; }
.gr svg.pg { width: 100%; height: auto; display: block; overflow: visible; }
.rp-fig .gr { max-width: 760px; }
.g-col { font: 600 10px var(--sans); fill: #8a8a8a; letter-spacing: .02em; }
.g-lbl { font: 10px var(--mono); fill: #333; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
.g-ptl { fill: #777; font-size: 9px; }
.g-grp { font: 600 9.5px var(--sans); fill: #8a8a8a; text-anchor: end; }
.g-e { fill: none; stroke: #d6d6d6; stroke-width: 1; }
.g-h { fill: none; stroke: #111; stroke-width: .8; opacity: .28; stroke-dasharray: 400; stroke-dashoffset: 0; transition: stroke-dashoffset .9s ease, opacity .3s; }
.g-h.new { stroke-dashoffset: 400; }
.g-start { fill: #111; }
.g-start.pend { fill: #fff; stroke: #111; }
.g-src { fill: #fff; stroke: #111; stroke-width: 1.2; }
.g-pg { transition: opacity .4s; cursor: pointer; }
.g-pg.new { opacity: 0; }
.g-pg circle { fill: #111; }
.g-pg.pend circle { fill: #fff; stroke: #111; stroke-width: 1.2; }
.g-pg .g-ring { fill: none; stroke: #111; stroke-width: 1; opacity: 0; transform-box: fill-box; transform-origin: center; }
.g-pg.active .g-ring { animation: gPulse 1.6s ease-out infinite; }
.g-pg .g-hit { fill: transparent; }
.g-pt { stroke-width: 1.3; transition: fill .4s, stroke .4s; }
.g-pt.d-wait { fill: #ececec; stroke: none; }
.g-pt.d-brist { fill: #111; stroke: #111; }
.g-pt.d-osaker { fill: #fff; stroke: #111; }
.g-pt.d-ok { fill: #c9c9c9; stroke: #c9c9c9; }
.g-pt.d-na { fill: #fff; stroke: #c9c9c9; }
.g-pt.d-rad { fill: #777; stroke: #777; }
.g-pt.d-kik { fill: #fff; stroke: #9a9a9a; stroke-dasharray: 1.5 1.5; }
.g-pt.d-need { fill: #fff; stroke: #555; stroke-dasharray: 1 1.5; }
.g-labels text, .g-nodes > * { transition: opacity .4s; }
.g-labels text.new, .g-nodes > .new { opacity: 0; }
svg.focus .g-h { opacity: .08; }
svg.focus .g-h.on { opacity: .9; stroke-width: 1.2; }
.g-pg.on circle { r: 4.5; }
.gtip { position: absolute; z-index: 3; width: 260px; background: #fff; border: 1px solid #111; border-radius: 4px; padding: 8px 10px;
  font-size: 13px; line-height: 1.45; box-shadow: var(--shadow); pointer-events: none; }
.gtip .u { font: 11.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; margin: 2px 0 4px; }
.gtip .pts { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; font: 12px var(--mono); }
.gtip .pts .d { margin-right: 3px; }
@keyframes gPulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(3); } }
@media (max-width: 860px) {
  .lv2 { grid-template-columns: minmax(0, 1fr); gap: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .st.enter, .st-lines li, .st-shots figure { animation: none !important; }
  .st-running .st-i { animation: none; border-color: #111; border-style: dotted; }
  .g-pg.active .g-ring { animation: none; }
  .g-h, .g-pg, .lv2 { transition: none !important; }
}

/* "Vad vi kontrollerar" */
.topnav { display: flex; gap: 20px; }
.toplink.on { color: var(--text); text-decoration: underline; text-underline-offset: 4px; }
.teaser { max-width: 640px; margin: 0 auto 40px; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.teaser h2 { font-size: 17px; margin: 0 0 4px; }
.teaser p { margin: 0 0 6px; color: var(--muted); }
.teaser .kv-sum { margin: 8px 0; }
.kv-head { max-width: 760px; }
.kv-head h1 { font-size: 30px; letter-spacing: -.02em; }
.kv-lead { font-size: 17px; line-height: 1.6; margin: 10px 0 14px; }
.kv-sum { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; color: var(--muted); margin: 0 0 16px; }
.kv-sum > span { display: inline-flex; align-items: center; gap: 6px; }
.kv-sum .num { color: var(--text); font-size: 15px; }
.kv-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 26px; }
.kv-filter .chip { border-radius: 4px; }
.kv-filter .chip[aria-pressed="true"] { background: #111; color: #fff; border-color: #111; }
.kv-cols { display: grid; grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr); border-bottom: 1px solid #111; padding-bottom: 6px; }
.kv-cols h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; }
.kv-grid { position: relative; }
.kv-row { display: grid; grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr); align-items: start; margin-bottom: 10px; }
.kv-row > .kr { grid-column: 1; }
.kv-pts { grid-column: 3; }
.kv-lines { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; overflow: visible; }
.kv-sec { font-size: 15px; margin: 22px 0 8px; }
.kr, .kp { padding: 10px 12px; margin: 0 0 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff;
  transition: opacity .25s, border-color .25s; }
.kr { cursor: pointer; }
.kr:focus-visible { outline: 2px solid #111; outline-offset: 1px; }
.kr-h { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.kr-h .num { font-weight: 600; }
.kr-t { margin: 0 0 6px; font-size: 15px; line-height: 1.55; }
.kr-t:last-child { margin-bottom: 0; }
.kr-pts { display: none; }
.kp-h { display: flex; gap: 8px; align-items: baseline; }
.kp-h b { font-size: 15px; }
.kp-w { margin: 4px 0 6px; font-size: 14.5px; line-height: 1.5; }
.kp-d { margin: 0; font-size: 13px; display: grid; gap: 2px; }
.kp-d div { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 8px; }
.kp-d dt { color: var(--muted); }
.kp-d dd { margin: 0; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.kp-d .d { align-self: center; }
.kv-lines path { fill: none; stroke: #111; stroke-width: 1; opacity: .25; transition: opacity .25s, stroke-width .25s; }
.kv-lines path.off { opacity: .05; }
.kv-lines circle { fill: #111; opacity: .35; }
.kv-grid.filtered .kp:not(.match), .kv-grid.filtered .kr:not(.match) { opacity: .3; }
.kv-grid.focus .kr:not(.hi), .kv-grid.focus .kv-pts .kp:not(.hi) { opacity: .35; }
.kv-grid.focus .kv-lines path { opacity: .05; }
.kv-grid.focus .kv-lines path.hi { opacity: 1; stroke-width: 1.6; }
.kr.hi, .kp.hi { border-color: #111; }
.kv-src { margin-top: 30px; max-width: 760px; }
@media (max-width: 860px) {
  .kv-cols { display: none; }
  .kv-grid { display: block; }
  .kv-row { display: block; }
  .kv-lines, .kv-pts { display: none; }
  .kr { cursor: default; }
  .kr-pts { display: block; margin-top: 8px; }
  .kp.nested { border: 0; border-left: 2px solid #111; border-radius: 0; padding: 6px 0 6px 12px; margin: 8px 0 0; }
  .kv-head h1 { font-size: 26px; }
}
@media (max-width: 420px) {
  .topnav { gap: 12px; }
  .toplink { font-size: 13px; }
  .brand { font-size: 16px; }
}

/* preliminary banner and review mode */
.prelim { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; border: 1.5px solid #111;
  border-radius: 4px; padding: 14px 16px; margin: 18px 0 0; font-size: 15px; line-height: 1.5; }
.prelim.done { border-style: solid; background: var(--surface-2); }
.prelim > div:first-child { flex: 1 1 360px; }
.prelim-a { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.prelim .btn, .prelim .btn-ghost { text-decoration: none; }
.d-open { border: 1.5px solid #c8c8c8; }
.d-need { border: 1.5px dotted #555; }
.rv-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 18px; }
.rv-head h1 { font-size: 26px; letter-spacing: -.02em; overflow-wrap: anywhere; }
.rv-prog { flex: 0 1 340px; font-size: 14px; color: var(--muted); }

.rv-bar i { display: block; height: 100%; background: #111; transition: width .4s ease; }
main .wrap:has(.rv) { max-width: 1320px; }
.rv-grid { display: grid; grid-template-columns: 230px minmax(0, 1fr) 330px; gap: 28px; align-items: start; margin-top: 18px; }
.rv-side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; scrollbar-width: thin; }
.rv-listbox > summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 4px 0 8px; }
.rv-filters { display: grid; gap: 4px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }

.rv-list { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.rv-list .rv-sec { font-size: 11.5px; font-weight: 600; color: var(--muted); margin: 10px 0 2px; }
.rv-list a { display: grid; grid-template-columns: 12px 40px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 3px 6px;
  border-radius: 3px; text-decoration: none; color: var(--text); }

.rv-list a.cur .d-brist { background: #fff; } .rv-list a.cur .d-osaker, .rv-list a.cur .d-open { border-color: #fff; }

.rv-list .ch { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 4px; }

.rv-ev section { margin: 0 0 22px; }
.rv-ev h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.rv-ph { margin-bottom: 16px; }
.rv-ph h2 { font-size: 24px; letter-spacing: -.01em; margin-top: 2px; }
.rv-sugg { font-size: 16px; margin: 0 0 6px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.rv-sugg .d { align-self: center; }
.rv-why { margin: 0 0 6px; max-width: 70ch; line-height: 1.6; }
.rv-q { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 14px; }

.rv-c { display: grid; grid-template-columns: 14px 1fr auto; grid-template-areas: "d l k" ". e e"; gap: 0 10px; align-items: center;

.rv-lbl { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }

.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; white-space: nowrap; }

@media (max-width: 1100px) {

/* numbers */

<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="#/">Villkors<span>kollen</span></a>
  <nav class="topnav"><a class="toplink" href="#/krav" id="nav-krav">Vad vi kontrollerar</a><a class="toplink" href="#/">Ny granskning</a></nav>
</div></header>
<main><div class="wrap" id="app"></div></main>
<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" hidden aria-label="Detaljer"></aside>

<script>
"use strict";

/* ---------- constants ---------- */

/* Judged points go in the bar; "kunde inte kontrolleras" and the two "kräver" states stay outside it. */
const JUDGED = ["brist", "osäker", "råd", "uppfyllt", "ej tillämplig"];
const KIK = "kunde inte kontrolleras";
const NEEDS = ["kräver intyg", "kräver testköp"];
const STATES = JUDGED.concat([KIK], NEEDS);
const STATE_CLASS = { "brist": "s-brist", "osäker": "s-osaker", "råd": "s-rad", "uppfyllt": "s-ok",
                      "ej tillämplig": "s-na", "kunde inte kontrolleras": "s-kik",
                      "kräver intyg": "s-intyg", "kräver testköp": "s-test" };
const STATE_PLURAL = { "brist": "Brister", "osäker": "Osäkra", "råd": "Råd", "uppfyllt": "Uppfyllda",
                       "ej tillämplig": "Ej tillämpliga", "kunde inte kontrolleras": "Kunde inte kontrolleras",
                       "kräver intyg": "Kräver intyg", "kräver testköp": "Kräver testköp" };
/* Internal points: only the shop can show them. Short question per point, from Svensk Handels kravtext. */
const INTYG = {
  "2b": "Har ni en organisation för kundservice som tar emot och besvarar kundernas frågor och klagomål?",
  "6.1b": "Har ni rutiner för att informera kunden när en leverans blir försenad?",
  "6.2b": "Är era rutiner vid leveransförseningar sådana att kundens rättigheter inte inskränks?",
  "8.1": "Har ni en organisation och rutin för att hantera reklamationsärenden?",
  "9c": "Har ni rutiner som säkerställer att återbetalningar och annan ersättning betalas ut?",
  "11a": "Har ni rutiner för hur avtal med minderåriga hanteras?",
  "11c": "Har ni rutiner för att marknadsföring som riktas mot minderåriga är ansvarsfull och följer god sed?",
  "14b": "Har ni rutiner för förfrågningar från kunder som vill utöva sina rättigheter om personuppgifter?",
  "14c": "Har ni rutiner för att personuppgifter hanteras enligt dataskyddslagstiftningen?",
};
/* Points that need a real order or contact with the shop's consent. */
const TESTKOP = {
  "2a": "Kräver en testfråga till kundtjänst, med butikens samtycke, för att mäta svarstiden.",
  "3.3": "Kräver ett testköp för att se om och när orderbekräftelsen kommer.",
  "6.3": "Kräver ett testköp för att se vilken information som följer med leveransen.",
};
/* Page in Svensk Handels "Krav för certifieringen Trygg E-handel" where each point's text stands. */
const SH_DOC = "Krav för certifieringen Trygg E-handel";
const SH_PAGE = {"1":1,"2a":1,"2b":1,"3.1":1,"3.2a":1,"3.2b":1,"3.2c":2,"3.3":2,"4a":2,"4b":2,"5a":2,"5b":2,
  "6.1a":2,"6.1b":2,"6.2":2,"6.2b":2,"6.3":2,"7.1a":3,"7.1b":3,"7.1c":3,"7.1d":3,"7.1e":3,"7.1f":3,"7.2":3,
  "8.1":3,"8.2":3,"8.3":3,"9a":4,"9b":4,"9c":4,"10a":4,"10b":4,"10c":4,"11a":4,"11b":4,"11c":4,"12a":4,"12b":4,
  "12c":4,"13a":4,"13b":4,"13c":5,"14a":5,"14b":5,"14c":5};
const OUTDATED = { "10b": "EU:s plattform för tvistlösning online (ODR) stängdes 2025-07-20 (Konsumentverket). Svensk Handel har inte ändrat kravet, så punkten ger aldrig brist." };
const TRUST = { oss: ["Kontrollerat av oss", "t-oss"], doc: ["Kontrollerat i butikens underlag", "t-doc"],
                egen: ["Butikens egen uppgift", "t-egen"], none: ["Inget underlag än", "t-none"] };
const SECTIONS = { 1: "Företagsuppgifter", 2: "Kundservice", 3: "Produkt och pris", 4: "Erbjudanden",
  5: "Köpknapp och villkor", 6: "Leverans", 7: "Ångerrätt", 8: "Reklamation och garanti", 9: "Återbetalning",
  10: "Tvistlösning", 11: "Minderåriga", 12: "Betalning", 13: "Prenumerationer", 14: "Dataskydd" };
const GROUPS = {
  1: ["Text på webbplatsen", "Kontrolleras automatiskt: vi läser villkor, policysidor och kontaktsidor och jämför texten med Svensk Handels krav."],
  2: ["Produktsida och kassa", "Kräver att man går igenom produktsidor och kassan fram till betalning. Ingår inte i den här versionen."],
  3: ["Över tid", "Kräver att butiken följs under en period, till exempel hur länge en rea pågår."],
  4: ["Testköp", "Kräver ett riktigt köp, till exempel orderbekräftelse och kundtjänstens svarstid."],
  5: ["Interna rutiner", "Syns inte utifrån. Butiken behöver själv visa sina rutiner."],
};
const ROLE = { "brist": ["Brist", "s-brist"], "stöd": ["Stöd", "s-ok"], "motsägelse": ["Motsägelse", "s-osaker"] };
const KIND = { start: "Startsida", villkor: "Köpvillkor", retur: "Retur/ånger", reklamation: "Reklamation",
  integritet: "Integritet", leverans: "Leverans", betalning: "Betalning", kontakt: "Kontakt", faq: "Frågor och svar",
  om: "Om oss", pdf: "PDF" };
const POLL_MS = 1500;

/* ---------- small helpers ---------- */

const $ = (sel) => document.querySelector(sel);

/** Escape text for use in HTML. Everything from the API goes through this. */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/** Only http(s) links are allowed out of the page. */
function safeUrl(u) {
  return /^https?:\/\//i.test(String(u || "")) ? esc(u) : "#";
}

function stateClass(s) { return STATE_CLASS[s] || "s-grey"; }
function pill(s) { return `<span class="pill ${stateClass(s)}">${esc(s)}</span>`; }

/** State shown for a result. Internal and test-purchase points that the engine left as
 *  "kunde inte kontrolleras" are shown as "kräver intyg" / "kräver testköp". */
function stateOf(r) {
  const s = r.state || KIK;
  if (s === KIK && INTYG[r.id]) return "kräver intyg";
  if (s === KIK && TESTKOP[r.id]) return "kräver testköp";
  return s;
}
function isNeed(r) { return NEEDS.includes(stateOf(r)); }

/** Trust level: who checked what the point rests on. */
function trustOf(r, rec) {
  const map = { "Kontrollerat av oss": "oss", "Kontrollerat i butikens underlag": "doc", "Butikens egen uppgift": "egen" };
  if (r.trust && map[r.trust]) return map[r.trust];
  if (isNeed(r)) return rec && map[rec.trust] ? map[rec.trust] : (stateOf(r) === "kräver intyg" ? "none" : null);
  if (JUDGED.includes(stateOf(r)) && r.method !== "ej automatiserad") return "oss";
  return null;
}
function trustTag(t) { return t ? `<span class="trust ${TRUST[t][1]}">${esc(TRUST[t][0])}</span>` : ""; }
function oldTag(id) { return OUTDATED[id] ? `<span class="oldreq">Svensk Handels krav föråldrat</span>` : ""; }

/** Short page title for the panel: the part of the <title> that is not the shop name. */
function shortTitle(p, shop) {
  const full = String(p.title || "").trim();
  if (!full) return KIND[p.kind] || hostOf(p.final_url || p.url) || "Sida";
  const host = hostOf(p.final_url || p.url).split(".")[0].toLowerCase();
  const shopL = String(shop || "").toLowerCase();
  let parts = full.split(/\s[|–—\-:·»]\s/).map((s) => s.trim()).filter(Boolean);
  const rest = parts.filter((s) => { const l = s.toLowerCase().replace(/[^a-z0-9åäö]/g, ""); return l && !l.includes(host) && l !== shopL.replace(/[^a-z0-9åäö]/g, ""); });
  let t = (rest[0] || parts[0] || full);
  return t.length > 60 ? t.slice(0, 57).trimEnd() + "…" : t;
}

/** URL for a screenshot path from the engine: "out/…" or relative to the scan's snapshot folder. */
function screenUrl(rep, path) {
  const s = String(path || "");
  if (!s || /(^|\/)\.\.(\/|$)/.test(s) || /^[a-z]+:/i.test(s)) return null;
  if (s.startsWith("/files/")) return s;
  if (s.startsWith("out/")) return "/files/" + s.slice(4).split("/").map(encodeURIComponent).join("/");
  if (rep.snapshot && String(rep.snapshot).startsWith("out/"))
    return "/files/" + (rep.snapshot.slice(4) + "/" + s).split("/").map(encodeURIComponent).join("/");
  return null;
}

function sectionOf(id) {
  const m = String(id).match(/^\d+/);
  return m ? Number(m[0]) : 0;
}

function fmtDate(v) {
  if (v == null || v === "") return "";
  const d = new Date(typeof v === "number" && v < 1e12 ? v * 1000 : v);
  return isNaN(d) ? String(v) : d.toLocaleString("sv-SE", { dateStyle: "medium", timeStyle: "short" });
}

function hostOf(u) {
  try { return new URL(u).host.replace(/^www\./, ""); } catch (e) { return u || ""; }
}

function countsOf(report) {
  const c = {};
  STATES.forEach((s) => (c[s] = 0));
  if (!(report.results || []).length && report.counts) return Object.assign(c, report.counts);
  (report.results || []).forEach((r) => { const s = stateOf(r); c[s] = (c[s] || 0) + 1; });
  return c;
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let msg = `Fel ${res.status}`;
    try { const j = await res.json(); if (j.detail) msg = typeof j.detail === "string" ? j.detail : msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

/* ---------- state ---------- */

const store = { reports: {}, pages: {}, screens: {}, intyg: {}, stats: {}, open: {}, review: {}, filter: null, tab: "punkter", rendered: null,
                pollTimer: null, lastFocus: null, depth: 0 };

/** Hash base for a scan: "#/demo" for the demo, "#/scan/<id>" otherwise. */
function base(id) { return id === "demo" ? "#/demo" : `#/scan/${encodeURIComponent(id)}`; }

function parseRoute() {
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean).map(decodeURIComponent);
  let id = null, rest = [];
  if (parts[0] === "demo") { id = "demo"; rest = parts.slice(1); }
  else if (parts[0] === "scan" && parts[1]) { id = parts[1]; rest = parts.slice(2); }
  if (parts[0] === "krav") return { name: "krav" };
  if (!id) return { name: "start" };
  const r = { name: "scan", id };
  if (rest[0] === "point" && rest[1]) {
    r.point = rest[1];
    if (rest[2] === "ev" && rest[3] != null) r.ev = Number(rest[3]);
  } else if (rest[0] === "page" && rest[1] != null) {
    r.page = Number(rest[1]);
  } else if (rest[0] === "replay" && id !== "demo") {
    r.replay = true;
  } else if (rest[0] === "granska" && id !== "demo") {
    r.review = true;
    r.rpid = rest[1] || null;
  }
  return r;
}

/* ---------- router ---------- */

window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", route);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#panel").hidden) closePanel(); });
$("#scrim").addEventListener("click", closePanel);

/** Closing the panel never adds a history step: go back to the report entry the panel was opened
 *  from, or replace the current entry when the panel was opened directly from a link. */
function closePanel() {
  const r = parseRoute();
  if (!r.id) return;
  const depth = (history.state && history.state.depth) || 0;
  if (depth > 0) { history.go(-depth); return; }
  history.replaceState({ depth: 0 }, "", base(r.id));
  route();
}

/** Remember on each history entry how many panel steps lie above the report view. */
function stampHistory(r) {
  const panel = !!(r.point || r.page != null);
  if (history.state && typeof history.state.depth === "number") { store.depth = history.state.depth; return; }
  const prev = store.lastRoute;
  const depth = !panel ? 0 : (prev && prev.id === r.id ? (prev.panel ? (store.depth ? store.depth + 1 : 0) : 1) : 0);
  history.replaceState({ depth }, "", location.hash || "#/");
  store.depth = depth;
}

async function route() {
  clearTimeout(store.pollTimer);
  store.rvKeys = null;
  const r = parseRoute();
  stampHistory(r);
  store.lastRoute = { id: r.id, panel: !!(r.point || r.page != null) };
  const nav = document.getElementById("nav-krav");
  if (nav) nav.classList.toggle("on", r.name === "krav");
  if (r.name === "start") { stopLive(); hidePanel(); store.rendered = null; return renderStart(); }
  if (r.name === "krav") { stopLive(); hidePanel(); store.rendered = null; window.scrollTo(0, 0); return renderKrav(); }
  if (r.replay) { hidePanel(); store.rendered = null; return startLive(r.id, "replay"); }
  if (LV && LV.id === r.id && LV.mode === "live") return;  // the live view follows the scan and opens the report itself
  stopLive();

  let report = store.reports[r.id];
  if (!report || report.status === "running") {
    if (r.id === "demo") report = store.reports.demo = demoReport();
    else {
      try { report = store.reports[r.id] = await api(`/api/scans/${encodeURIComponent(r.id)}`); }
      catch (e) { hidePanel(); store.rendered = null; return renderMissing(r.id, e); }
    }
  }
  if (report.status === "running") { hidePanel(); store.rendered = null; return startLive(r.id, "live"); }
  if (report.status === "failed") { hidePanel(); store.rendered = null; return renderFailed(report); }
  if (r.review) { hidePanel(); store.rendered = null; await loadExtras(report); return renderReview(report, r.rpid); }
  store.rvKeys = null;

  if (store.rendered !== r.id) {
    await loadExtras(report);
    renderReport(report);
    store.rendered = r.id;
    window.scrollTo(0, 0);
  }
  markCurrent(r.point);
  if (r.point && r.ev != null) renderEvidencePage(report, r.point, r.ev);
  else if (r.point) renderPoint(report, r.point);
  else if (r.page != null) renderPage(report, r.page, null, null);
  else hidePanel();
}

/** Screenshots per page and the shop's saved answers for internal points. Failures leave them empty. */
async function loadExtras(rep, haveStats) {
  if (rep.id === "demo") { store.screens.demo = {}; store.intyg.demo = store.intyg.demo || {}; return; }
  const id = encodeURIComponent(rep.id);
  const want = !haveStats && !store.stats[rep.id];
  const [s, i, ev, rev] = await Promise.all([api(`/api/scans/${id}/screens`).catch(() => ({})),
                                        api(`/api/scans/${id}/intyg`).catch(() => ({})),
                                        want ? api(`/api/scans/${id}/events?since=0`).catch(() => null) : null,
                                        api(`/api/scans/${id}/review`).catch(() => null)]);
  if (rev) store.review[rep.id] = rev;
  store.screens[rep.id] = s || {};
  store.intyg[rep.id] = i || {};
  if (ev && ev.events) {
    const S = newStats();
    S.synthetic = !!ev.synthetic;
    ev.events.forEach((e) => reduceStats(S, e));
    store.stats[rep.id] = S;
  }
}

function schedulePoll(id) {
  store.pollTimer = setTimeout(async () => {
    const r = parseRoute();
    if (r.id !== id) return;
    try { store.reports[id] = await api(`/api/scans/${encodeURIComponent(id)}`); } catch (e) {}
    route();
  }, POLL_MS);
}

/* ---------- start ---------- */

function renderStart() {
  document.title = "Scanningsverktyg prototyp 1";
  $("#app").innerHTML = `
    <section class="hero">
      <h1>Scanningsverktyg prototyp 1</h1>
      <p>Kontrollera en webbutik mot Svensk Handels krav för Trygg E-handel.</p>
      <form class="urlform" id="urlform" novalidate>
        <input id="url" type="text" inputmode="url" autocomplete="url" placeholder="Webbutikens adress, t.ex. exempelbutiken.example" aria-label="Webbutikens adress" required>
        <button class="btn" type="submit" id="go">Granska</button>
      </form>
      <p class="small error" id="formerr" role="alert"></p>
    </section>
    <section class="teaser" aria-label="Vad vi kontrollerar">
      <h2>Vad vi kontrollerar</h2>
      <p>Svensk Handels krav för Trygg E-handel och våra 45 punkter, sida vid sida: vad vi letar efter, var, och om vi kan visa en brist automatiskt eller bara flaggar för granskning.</p>
      <p class="kv-sum" id="teaser-sum"></p>
      <p style="margin:0"><a href="#/krav">Se kraven och hur vi kontrollerar dem</a></p>
    </section>
    <section class="recent">
      <h2>Tidigare granskningar</h2>
      <div class="card" id="recent"><p class="empty">Hämtar…</p></div>
      <p class="small muted" style="margin-top:12px">Vill du se hur en rapport ser ut? <a href="#/demo">Öppna en exempelrapport</a>.</p>
    </section>`;
  $("#url").focus();
  $("#urlform").addEventListener("submit", startScan);
  (store.method ? Promise.resolve(store.method) : api("/api/method")).then((m) => {
    store.method = m;
    const box = document.getElementById("teaser-sum");
    if (!box) return;
    box.innerHTML = BUCKETS.map(([k, label, os]) => `<span>${dot(OUTCOME_DOT[os[0]])}<span class="num">${m.points.filter((p) => os.includes(p.outcome)).length}</span> ${label}</span>`).join("");
  }).catch(() => {});
  loadRecent();
}

async function startScan(e) {
  e.preventDefault();
  const url = $("#url").value.trim();
  const err = $("#formerr");
  err.textContent = "";
  if (!url) { err.textContent = "Skriv in en adress till en webbutik."; return; }
  $("#go").disabled = true;
  try {
    const { id } = await api("/api/scans", { method: "POST", headers: { "Content-Type": "application/json" },
                                             body: JSON.stringify({ url }) });
    delete store.reports[id];
    location.hash = base(id);
  } catch (ex) {
    err.textContent = `Granskningen kunde inte startas: ${ex.message}`;
    $("#go").disabled = false;
  }
}

async function loadRecent() {
  const box = $("#recent");
  let scans;
  try { scans = await api("/api/scans"); }
  catch (e) { box.innerHTML = `<p class="empty">Kunde inte hämta tidigare granskningar.</p>`; return; }
  if (!box.isConnected) return;
  if (!scans || !scans.length) { box.innerHTML = `<p class="empty">Inga granskningar än.</p>`; return; }
  const seen = new Set();
  scans = scans.filter((s) => { const k = hostOf(s.url) || s.id; return seen.has(k) ? false : seen.add(k); }).slice(0, 12);
  box.innerHTML = `<ul class="scanlist">${scans.map((s) => {
    const c = s.counts || {};
    let right = "";
    if (s.status === "running") right = `<span class="muted">Pågår…</span>`;
    else if (s.status === "failed") right = `<span class="error">Misslyckades</span>`;
    else {
      const b = c["brist"] || 0, o = c["osäker"] || 0;
      right = `<span class="pill ${b ? "s-brist" : "s-grey"}">${b} ${b === 1 ? "brist" : "brister"}</span> `
            + `<span class="pill ${o ? "s-osaker" : "s-grey"}">${o} ${o === 1 ? "osäker" : "osäkra"}</span>`;
    }
    return `<li><a href="${base(s.id)}">
      <div><div class="shop">${esc(s.shop || hostOf(s.url))}</div>
      <div class="meta">${esc(s.url)}${s.finished ? " · " + esc(fmtDate(s.finished)) : ""}</div></div>
      <div class="right">${right}</div></a></li>`;
  }).join("")}</ul>`;
}

/* ---------- progress, failure ---------- */

function renderProgress(rep) {
  document.title = "Granskar… – Scanningsverktyg prototyp 1";
  const lines = rep.progress || [];
  const last = (lines[lines.length - 1] || "").toLowerCase();
  const stage = /kontroll|regel|regl|punkt/.test(last) ? 2 : lines.length > 1 ? 1 : 0;
  const steps = ["Hittar sidor", "Läser villkor och policyer", "Kontrollerar 45 punkter"];
  $("#app").innerHTML = `
    <section class="progress">
      <h1><span class="spinner" aria-hidden="true"></span>Granskar ${esc(rep.shop || hostOf(rep.url || rep.input))}</h1>
      <p class="muted small" style="overflow-wrap:anywhere">${esc(rep.url || rep.input)}</p>
      <div class="steps">${steps.map((s, i) => `<span class="step${i === stage ? " on" : ""}">${i + 1}. ${s}</span>`).join("")}</div>
      <p class="small muted">Vi letar upp butikens köpvillkor, retur-, integritets- och kontaktsidor, läser texten
        och jämför den med Svensk Handels krav. Det tar oftast under en minut.</p>
      <div class="card"><ul class="loglines" aria-live="polite">${lines.map((l) => `<li>${esc(l)}</li>`).join("") || "<li>Startar…</li>"}</ul></div>
    </section>`;
}

function renderFailed(rep) {
  document.title = "Granskningen misslyckades – Scanningsverktyg prototyp 1";
  $("#app").innerHTML = `
    <section class="progress">
      <h1>Granskningen misslyckades</h1>
      <p class="muted" style="overflow-wrap:anywhere">${esc(rep.url || rep.input)}</p>
      <p class="error">${esc(rep.error || "Okänt fel.")}</p>
      ${(rep.progress || []).length ? `<div class="card"><ul class="loglines">${rep.progress.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></div>` : ""}
      <p style="margin-top:20px"><a class="btn-ghost" href="#/">Försök med en annan adress</a></p>
    </section>`;
}

function renderMissing(id, e) {
  $("#app").innerHTML = `
    <section class="progress">
      <h1>Granskningen hittades inte</h1>
      <p class="muted">${esc(e.message)}</p>
      <p><a class="btn-ghost" href="#/">Till startsidan</a></p>
    </section>`;
}

/* ---------- report ---------- */

function pagesTab(rep) {

  const pages = rep.pages || [];
  if (!pages.length) return `<p class="empty">Inga sidor lästes.</p>`;
  return `<p class="sect-sub">Sidorna vi hittade och läste, i den ordning vi hittade dem. Sidor med villkor för företag används inte som underlag för konsumentpunkter.</p>
    <div class="card"><table class="pages">
      <thead><tr><th>Typ</th><th>Titel</th><th>Hur vi hittade den</th><th>Länk</th></tr></thead>
      <tbody>${pages.map((p, n) => `<tr>
        <td><span class="kind">${esc(KIND[p.kind] || p.kind || "")}</span>${p.is_pdf ? '<span class="badge">PDF</span>' : ""}${p.business ? '<span class="badge">Företag</span>' : ""}</td>
        <td><a href="${b}/page/${n}">${esc(p.title || hostOf(p.url))}</a>${p.n_chars != null ? `<div class="small muted">${esc(Number(p.n_chars).toLocaleString("sv-SE"))} tecken</div>` : ""}</td>
        <td class="small">${esc(p.how || "")}</td>
        <td class="small"><a href="${safeUrl(p.final_url || p.url)}" target="_blank" rel="noopener noreferrer">${esc(hostOf(p.final_url || p.url))}${esc(pathOf(p.final_url || p.url))}<span class="nowrap">&nbsp;↗</span></a></td>
      </tr>`).join("")}</tbody></table></div>`;
}

function pathOf(u) { try { const x = new URL(u); return x.pathname === "/" ? "" : x.pathname; } catch (e) { return ""; } }

  const n = {};

  return `<div class="about">
    <h2>Vad granskningen gör</h2>
    <p>Vi hämtar butikens startsida, letar upp köpvillkor, retur-, reklamations-, integritets-, leverans- och kontaktsidor
      och läser texten. Varje punkt i Svensk Handels krav för Trygg E-handel jämförs sedan med det som står där.</p>
    <h2>Vad som kontrolleras automatiskt</h2>
    <p>Svensk Handels 45 punkter går att kontrollera på olika sätt. Punkter som bara butiken själv kan visa, som interna rutiner,

      <b>${g}. ${esc(GROUPS[g][0])}</b><span class="n">${n[g] || 0} punkter</span>

    <h2>Vad tillstånden betyder</h2>

    <p>${pill("osäker")} Vi hittade något som kan vara ett problem, eller hittade inte det vi letade efter, men mönstret är för svagt för att säga brist.</p>
    <p>${pill("uppfyllt")} Texten innehåller det Svensk Handel kräver.</p>
    <p>${pill("råd")} Inget fel mot kravet, men något butiken kan förbättra. Räknas inte som brist.</p>
    <p>${pill("ej tillämplig")} Punkten gäller inte butiken, till exempel prenumerationer när butiken inte säljer sådana.</p>
    <p>${pill("kunde inte kontrolleras")} Kontrollen gick inte att göra, till exempel för att sidan inte gick att läsa eller kassan inte nåddes. Ingen bedömning.</p>

    <p>${trustTag("egen")} Butiken har själv svarat; ingen har kontrollerat svaret.</p>
    <h2>Hur resultatet ska läsas</h2>
    <p>Resultaten är underlag för en människa, inte juridiska bedömningar. Varje punkt visar Svensk Handels text, vad vi letade efter

/* ---------- panel ---------- */

function showPanel(html) {
  const p = $("#panel");
  const wasHidden = p.hidden;
  if (wasHidden) store.lastFocus = document.activeElement;
  p.innerHTML = html;
  p.hidden = false; $("#scrim").hidden = false;
  document.body.style.overflow = window.innerWidth <= 720 ? "hidden" : "";
  p.scrollTop = 0;
  p.querySelector(".close").addEventListener("click", closePanel);
  p.querySelector(".close").focus({ preventScroll: true });
}

function hidePanel() {
  const p = $("#panel");
  if (p.hidden) return;
  p.hidden = true; $("#scrim").hidden = true; p.innerHTML = "";
  document.body.style.overflow = "";
  if (store.lastFocus && store.lastFocus.isConnected) store.lastFocus.focus({ preventScroll: true });
}

function findResult(rep, pid) { return (rep.results || []).find((r) => String(r.id) === pid); }

function pageName(rep, n) {
  const p = (rep.pages || [])[n];
  return p ? shortTitle(p, rep.shop) : `Sida ${n}`;
}

function renderPoint(rep, pid) {
  const r = findResult(rep, pid);
  const b = base(rep.id);
  if (!r) return showPanel(`<div class="phead"><h2>Punkten finns inte</h2><button class="close" aria-label="Stäng">×</button></div>`);
  const st = stateOf(r);
  const ev = r.evidence || [];
  const manual = r.method === "ej automatiserad";
  const need = isNeed(r);
  const g = GROUPS[r.group];
  const rec = (store.intyg[rep.id] || {})[r.id];
  const shPage = r.sh_page || SH_PAGE[r.id];
  const screens = store.screens[rep.id] || {};
  const scanned = fmtDate(rep.finished || rep.started);
  const pages = rep.pages || [];
  const why = need ? (st === "kräver intyg"
      ? "Punkten gäller butikens interna rutiner och syns inte på webbplatsen. Den bedöms inte här; butiken kan svara och bifoga underlag nedan."
      : "Punkten kräver ett riktigt köp eller kontakt med kundtjänst, vilket bara görs med butikens samtycke. Den bedöms inte här.")
    : (r.why || r.summary);
  showPanel(`
    <div class="phead">
      <div><h2><span class="pid">${esc(r.id)}</span> ${esc(r.label)}</h2>
        <div class="sub">${pill(st)} ${oldTag(r.id)} ${trustTag(trustOf(r, rec))}<span class="small muted">${esc(SECTIONS[sectionOf(r.id)] || "")}</span></div></div>
      <button class="close" aria-label="Stäng">×</button>
    </div>
    <div class="pbody">
      <section><h3>Svensk Handels krav</h3><blockquote class="sh">${esc(r.sh)}</blockquote>
        <div class="shref">Svensk Handel, ${esc(SH_DOC)}${shPage ? `, s. ${esc(shPage)}` : ""}. Ordagrant; … markerar utelämnad text.</div></section>
      ${OUTDATED[r.id] ? `<section><h3>Svensk Handels krav föråldrat</h3><div class="note">${esc(OUTDATED[r.id])}</div></section>` : ""}
      <section><h3>${st === "brist" ? "Varför det är en brist" : "Vår bedömning"}</h3><p class="why" style="margin:0">${esc(why)}</p>
        ${st === "osäker" ? `<p class="small muted" style="margin:8px 0 0">Osäker är ingen brist. En människa behöver titta på punkten.</p>` : ""}</section>
      ${st === "kräver intyg" ? intygForm(rep, r, rec) : ""}
      ${manual && !need ? `<section><h3>Varför den inte kontrolleras automatiskt</h3>
        <div class="note">${g ? `<b>${esc(g[0])}.</b> ${esc(g[1])}` : "Den här punkten kontrolleras inte automatiskt."}</div></section>` : ""}
      ${r.looked_for && !need ? `<section><h3>Vad vi letade efter</h3><p style="margin:0">${esc(r.looked_for)}</p></section>` : ""}
      ${ev.length ? `<section><h3>Citat från butikens sidor</h3>${ev.map((e, k) => {
        const [rl, cls] = ROLE[e.role] || [e.role || "Citat", "s-grey"];
        const pg = pages[e.page] || {};
        const shot = e.screen ? screenUrl(rep, e.screen) : null;
        const pshot = !shot && screens[String(e.page)];
        return `<div class="ev ${cls}"><div class="role">${esc(rl)}</div>
          <div class="evmeta">${esc(shortTitle(pg, rep.shop))}${e.heading ? " · " + esc(e.heading) : ""} · Hämtad ${esc(scanned)}</div>
          <blockquote>${esc(e.quote)}</blockquote>
          ${shot ? `<a href="${esc(shot)}" target="_blank" rel="noopener"><img class="shot" src="${esc(shot)}" alt="Skärmbild: ${esc(rl)} ${esc(r.id)}" loading="lazy"></a>` : ""}
          ${pshot ? `<details class="shotbox"><summary>Skärmbild av sidan</summary><a href="${esc(pshot)}" target="_blank" rel="noopener"><img class="shot" src="${esc(pshot)}" alt="Skärmbild av ${esc(shortTitle(pg, rep.shop))}" loading="lazy"></a></details>` : ""}
          <div class="links"><a href="${b}/point/${encodeURIComponent(r.id)}/ev/${k}">Visa i sammanhang</a>
          <a class="url" href="${safeUrl(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.url)}</a></div></div>`;
      }).join("")}</section>` : ""}
      ${st === "brist" && !ev.length ? `<section><h3>Citat från butikens sidor</h3><p class="muted" style="margin:0">Inget citat: bristen är att uppgiften saknas. Vi sökte i sidorna nedan, hämtade ${esc(scanned)}.</p></section>` : ""}
      ${need ? "" : (r.pages_read || []).length ? `<section><h3>Sidor vi läste för den här punkten (${r.pages_read.length})</h3><ul class="plist">${r.pages_read.map((n) => {
        const p = pages[n] || {};
        return `<li><a href="${b}/page/${encodeURIComponent(n)}">${esc(shortTitle(p, rep.shop))}</a> <span class="kind">${esc(KIND[p.kind] || p.kind || "")}</span>${p.n_chars != null ? `<span class="small muted"> · ${esc(Number(p.n_chars).toLocaleString("sv-SE"))} tecken</span>` : ""}</li>`;
      }).join("")}</ul></section>`
        : (!manual ? `<section><h3>Sidor vi läste för den här punkten</h3><p class="muted" style="margin:0">Inga.</p></section>` : "")}
      ${need || manual ? "" : unreadSection(rep)}
    </div>`);
  const f = $("#intygform");
  if (f) f.addEventListener("submit", (e) => submitIntyg(e, rep, r));
}

/** Pages that were found but gave little or no text, plus any the engine lists as not read. */
function unreadPages(rep) {
  const out = [];
  (rep.pages || []).forEach((p, n) => {
    if (p.n_chars != null && p.n_chars < 200)
      out.push({ n, title: shortTitle(p, rep.shop), url: p.final_url || p.url, reason: `${p.n_chars} tecken text` });
  });
  [].concat(rep.not_read || [], rep.unread || []).forEach((u) => {
    if (typeof u === "string") out.push({ url: u, title: hostOf(u) + pathOf(u), reason: "" });
    else if (u && u.url) out.push({ url: u.url, title: u.title || hostOf(u.url) + pathOf(u.url), reason: u.reason || u.error || "" });
  });
  return out;
}

function unreadSection(rep) {
  const b = base(rep.id);
  const list = unreadPages(rep);
  return `<section><h3>Sidor som inte gick att läsa</h3>${list.length ? `<ul class="plist">${list.map((u) => `<li>${u.n != null
    ? `<a href="${b}/page/${u.n}">${esc(u.title)}</a>` : `<a href="${safeUrl(u.url)}" target="_blank" rel="noopener noreferrer">${esc(u.title)}</a>`}${u.reason ? `<span class="small muted"> · ${esc(u.reason)}</span>` : ""}</li>`).join("")}</ul>`
    : `<p class="muted" style="margin:0">Alla ${(rep.pages || []).length} sidor vi hittade gav läsbar text.${(rep.pages || []).some((p) => ["produkt", "kampanj", "kassa"].includes(p.kind)) ? "" : " Produktsidor och kassan ingår inte i den här granskningen."}</p>`}</section>`;
}

    </div>` : "";
  return `<section><h3>Butikens intyg</h3>${saved}
    <form class="form" id="intygform">

      <div class="yn">
        <label><input type="radio" name="answer" value="ja"${rec && rec.answer === "ja" ? " checked" : ""}> Ja</label>
        <label><input type="radio" name="answer" value="nej"${rec && rec.answer === "nej" ? " checked" : ""}> Nej</label>
      </div>
