# Ämnen per mening (app/text/topics.py). En mening får ämnet om meningen själv eller rubriken
# närmast ovanför innehåller ett av orden. Varje värde är en lista med alternativ (sätts ihop med |).
#
# Öppet köp och ångerrätt hålls isär: en mening som handlar om öppet köp (i texten eller under en
# rubrik om öppet köp) och inte själv nämner ångerrätten räknas inte till ångerrätten.
# "Utöver ångerrätten erbjuder vi 30 dagars öppet köp" handlar om öppet köp.

ångerrätt:
  - 'ånger'
  - 'ångra'
  - 'frånträd'
