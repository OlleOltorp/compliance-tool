# 7.1a–7.2 Ångerrätten.
# Ett värde är ett reguljärt uttryck eller en lista med alternativ (de sätts ihop med |).
# {NUM} betyder ett tal i siffror eller ord.

EXCL:
  - 'gäller (heller |dock |däremot |tyvärr )?(ej|inte|aldrig)'
  - 'undantag'
  - 'undantas'
  - 'omfattas (ej|inte|heller inte)'
  # ”Ångerrätten omfattar inte livsmedel”
  - '(ånger\w*|ångra\w*) (\w+ )?omfattar (heller )?(ej|inte)'
  - 'kan (ej|inte) ångras'
  - 'återtas (ej|inte)'
  - 'ingen ångerrätt'
  - 'ej ångerrätt'
  - 'ångerrätt\w* (gäller )?(ej|inte)'
  - 'tar (ej|inte) emot retur'
  - 'går (inte|ej) att (ångra|returnera)'
  - 'gäller vare sig'
  # ”Vi tar inte emot livsmedel i retur”
  - '\btar (vi )?(ej|inte|aldrig) emot\b[^.]{0,60}?\bi retur'
VALUE:
  - '(understig\w*|överstig\w*|under|över|mindre än|högre än|lägre än)\s+[^.]{0,30}?\d[\d  .]*\)?\s*(kr|kronor|sek)\b'
  - '(orderbelopp|ordervärde|beställningsvärde)\w*\s+(under|över|understig|överstig|är lägre|är högre)'
