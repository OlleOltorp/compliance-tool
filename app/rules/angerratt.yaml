  # ”Ångerfristen löper ut 100 dagar efter dagen då du … tar varan i fysisk besittning” (Konsumentverkets mall)
  - 'besittning'
  # ”30 dagars ångerrätt från leveransen”: the delivery is the receipt
  - '(från|efter)\s+(den\s+)?leveransen\b'
  # ”från den dag du fick ditt första tidningsexemplar”: för prenumerationer räknas fristen från första leveransen
  - 'fick (du |ni )?(ditt|din|dina|varan|varorna|paketet|leveransen)\b'
  - 'först\w* (tidnings)?exemplar'
# Ångerfristens längd (faktatabellen, 7.1c). START: från när den räknas.
FRIST:
  - '{NUM}\s*dagars\s*(lagstadgad\s+)?(ånger|ångerrätt|ångerfrist)'
  - '(ångerrätt\w*|ångerfrist\w*)\s+(är\s+|gäller\s+)?(i|inom|på|under)\s+{NUM}\s*dagar'
  - 'ångra\w*\s+(\w+\s+){0,4}?(inom|i)\s+{NUM}\s*dagar'
  - 'rätt att ångra[^.]{0,90}?inom\s+{NUM}\s*dagar'
  # Konsumentverkets mall: ”rätt att frånträda detta avtal … inom 14 dagar”, ”Ångerfristen löper ut 14 dagar efter …”
  - 'rätt att frånträda[^.]{0,60}?(inom|senast)\s+{NUM}\s*dagar'
  # ”Ångerrättsperioden upphör 14 dagar efter den dag när du: a) har mottagit din vara”
  - '(ångerfrist|ångerrättsperiod|ångerperiod|ångertid)\w*\s+(löper ut|går ut|upphör)\s+{NUM}\s*dagar'
  # ”Ångerfristen är 14 dagar och räknas från …”, ”Ångerrätten gäller 14 dagar från orderdatum”
  - '(ångerrätt\w*|ångerfrist\w*)\s+(är|gäller|löper)\s+{NUM}\s*dagar'
  # ”Du har 14 dagar på dig att ångra ditt köp”, ”Ångerrätt: 14 dagar från leveransdagen”, ”Ångerrätt 14 dagar från …”
  - '{NUM}\s*dagar\s+på\s+dig\s+att\s+ångra'
  - '(ångerrätt|ångerfrist)\w*\s*:\s*{NUM}\s*dagar'
  - '^\W*(ångerrätt|ångerfrist)\w*\s+{NUM}\s*dagar'
# Fristen räknas från köpet eller ordern (7.1c, 7.1d): för varor ska ångerfristen räknas från mottagandet och returtiden
# från ångermeddelandet. Nämns mottagandet eller leveransen också blir startpunkten oklar.
PURCHASE:
  - 'köpdatum\w*'
  - 'köptillfälle\w*'
  - 'inköpsdatum\w*'
  - 'inköpsdag\w*'
  - 'beställningsdag\w*'
  - 'beställningsdatum\w*'
  - 'orderdag\w*'
  - 'orderdatum\w*'
  - 'beställning(en)? gjordes'
  - 'från (det att |att |då )?(du |ni )?(har )?(handla|beställ|köpt\b|köpte\b)\w*'
  - 'dagar\w*\s+(räknat\s+|räknas\s+)?(från|efter)\s+(och med\s+)?(dagen för\s+|datumet för\s+)?(köpet|ordern|beställningen)\b'
  - '(räknas|räknat|gäller)\s+från\s+(det\s+)?(att|då)\s+(du\s+|ni\s+)?(har\s+)?(lagt|gjort|skickat)\s+(din\s+|er\s+)?(order|beställning)'
  # ”från det att du lagt din order”, ”från att ordern lagts”, ”räknat från köpdagen”
  - 'köpdag\w*'
  - '(från|efter)\s+(det\s+)?(att|då)\s+(du\s+|ni\s+)?(har\s+)?(lagt|lade|gjort|gjorde)\s+(din\s+|er\s+)?(order|beställning)'
  - '(från|efter)\s+(det\s+)?(att|då)\s+(ordern|beställningen)\s+(har\s+)?(lagts|lades|gjorts|gjordes)'
# ”Meddelande om detta ska lämnas … senast inom fjorton (14) dagar från det att varan mottagits”; räknas bara i text om ångerrätten
FRIST_NOTICE: '(meddelande|anmälan)\s[^.]{0,60}?(inom|senast)\s+{NUM}\s*dagar'
# Fristen för ångermeddelandet med sin startpunkt i samma mening (7.1c), i ord som FRIST inte läser: ”Du har 14 dagar på
# dig från mottagande av varorna att meddela oss att du ångrar”, ”kontaktar du vår kundtjänst … inom 14 dagar från
# mottagande av produkten”, ”Du ska inom 14 dagar från mottagandet ge oss beskedet”. Räknas bara när meningen också
# säger från när (START eller PURCHASE) och inget returverb står inne i träffen (då är det returtiden, 7.1d).
FRIST_START:
  - '{NUM}\s*dagar\s+(på\s+dig\s+)?(räknat\s+)?(från|efter)\s+[^.]{0,60}?\batt\s+(\w+\s+){0,2}?(meddela|ångra|underrätta|kontakta|frånträda|utöva|nyttja|utnyttja)\w*'
  - '(meddela\w*|besked\w*|ångra\w*|kontakta\w*|frånträd\w*|underrätta\w*|anmäl\w*)\b[^.]{0,80}?(inom|senast)\s+{NUM}\s*dagar\s+(räknat\s+)?(från|efter)'
  - '(inom|senast)\s+{NUM}\s*dagar\s+(räknat\s+)?(från|efter)\s+[^.]{0,60}?(meddela\w*|besked\w*|ångermeddelande\w*|ångra\w*|frånträda)'
RET:
  - 'skicka\w*'
  - 'sänd\w*'
  - 'returnera\w*'
  - 'återlämna\w*'
  - 'lämna\w* tillbaka'
  - 'återsänd\w*'
  - 'åter till oss'
  - 'tillbaka till oss'
  # ”Returen ska vara oss tillhanda senast 14 dagar efter …”
  - 'oss tillhanda'
# Returtiden (faktatabellen, 7.1d): RET skicka tillbaka, PER inom N dagar, NOTICE från ångermeddelandet, RECEIPT från mottagandet.
# ”Du har sen 14 dagar på dig”, ”Du har 14 dagar från …”, ”inom två veckor” (veckor räknas om till dagar i faktatabellen)
PER: '(inom|senast|i vart fall|har du|(?:du|ni|kunden|konsumenten) har|har\s+(?:du\s+)?(?:sen|sedan|därefter|då)|senare än)\s+(inom\s+|senast\s+|ytterligare\s+)?(?:en\s+)?{NUM}\s*(/\s*\d+\s*)?(?:kalender|arbets|bank)?(dagar|dagars|veckor|veckors|-dagars\w*)'
NOTICE:
  - '(från|efter)[^.]{0,30}?(meddela\w*|underrätt\w*|ångermeddelande\w*|anmäl\w*|frånträda|ångerbesked\w*|ångerärende\w*)'
  # ”inom 14 dagar från det datum då du informerade oss om att du önskade nyttja ångerrätten”
  - '(från|efter)[^.]{0,30}?\b(du|ni|jag|kunden|konsumenten|köparen)\s+(har\s+)?(informera|kontakta|mejla|maila|e-posta)\w*\s+(till\s+)?(oss|kundtjänst|kundservice|säljaren|butiken)'
  - '(från|efter)\s+(det\s+)?(att\s+|då\s+)?(du|ni|jag|kunden|konsumenten|köparen)\s+(har\s+)?(ångrat|ångrar|ångrade|ångra|utövat|utövar|utövade|utnyttjat|utnyttjar|utnyttjade|frånträtt|frånträdde|frånträder)\b'
  # ”Efter att man har åberopat sin ångerrätt ska man skicka tillbaka varan inom 60 dagar”
  - '(från|efter)\s+(det\s+)?(att\s+|då\s+)?(du|ni|man|kunden|konsumenten)\s+(har\s+)?(åberopat|åberopar|åberopade)\b'
  - '(från|efter)\s+(det\s+)?(att\s+|då\s+)?man\s+(har\s+)?(ångrat|ångrade|utövat|utövade|utnyttjat|utnyttjade|meddelat)\b'
  # passive and noun forms: ”senast 14 dagar efter att ångerrätten har åberopats”, ”från den dag ångerrätten utövades”,
  # ”från ångerdagen”, ”efter beskedet om ånger”
  - '(från|efter)\s+(det\s+att\s+|att\s+|den\s+dag\s+(då\s+|när\s+)?|dagen\s+(då\s+)?)?(ångerrätten|ångern|köpet|avtalet)\s+(har\s+)?(utövats|utövades|utnyttjats|utnyttjades|åberopats|åberopades|meddelats|meddelades|anmälts|anmäldes|ångrats|ångrades|frånträtts|frånträddes)\b'
  - '(från|efter)\s+(den\s+)?(ångerdag|ångerdatum)\w*'
  - '(från|efter)\s+(beskedet|meddelandet|anmälan)\s+om\s+(ånger\b|ångerrätt|att\s+(du|ni)\s+(vill\s+)?ångra)'
  # ”inom 14 dagar efter Exempelhandeln.se (556000-0000) fått anmälan om ångerrätt”
  - '(från|efter)\s+(att\s+|det\s+att\s+)?[^,;]{0,60}?(fått|mottagit|tagit emot)\s+(din\s+|ditt\s+|er\s+|kundens\s+)?(anmälan|meddelande|besked)'
  # ”När du har meddelat oss att du vill ångra ditt köp ska varan skickas tillbaka … senast inom 14 dagar”
  # ”När konsument meddelat ånger ska varan skickas tillbaka senast inom 14 dagar”
  - '\bnär\s+(du|ni|kunden|konsument|konsumenten)\s+(har\s+)?(meddelat|underrättat|anmält|informerat|meddelar|underrättar|informerar)\b'
  # ”När vi hanterat ditt ärende får du en returfraktsedel …”, ”inom 14 dagar efter din kontakt med kundtjänst”
  - '\b(när|efter att|sedan)\s+vi\s+(har\s+)?(hanterat|registrerat|behandlat|tagit emot|mottagit)\s+(ditt|din)\s+(ärende|ångerärende|returärende|anmälan|meddelande|ånger)\w*'
  - '(från|efter)\s+(din|er)\s+kontakt\b'
# ”Meddela oss att du ångrar dig. Därefter har du ytterligare 14 dagar på dig att skicka tillbaka varan.”
THEN: '\b(därefter|sedan|efter det|efter detta|från och med då)\b[^.]{0,60}\bytterligare\b'
RECEIPT: '(från|efter)\s+(det att|den dag|att)?\s*(då\s+)?(du\s+)?(har\s+)?(fått|mottagit|mottog|tagit emot|tog emot|erhållit|fick)'
# Returtiden räknas från leveransen eller uthämtningen: ”inom 30 dagar från det att varan levererats”, ”efter att du hämtat
# ut paketet”, ”från mottagandet”. Samma startpunkt som RECEIPT.
DELIVERED: '(från|efter)\s+(det\s+att\s+|att\s+|då\s+|den\s+dag\s+(då\s+)?|dagen\s+(då\s+)?)?[^.,;]{0,30}?(levererats|levererades|leveransen\b|leveransdag\w*|leveransdatum|hämta\w*\s+ut|uthämtning\w*|mottagande\w*|mottagits|ankomst\w*|kommit fram)'
# Ångerrätten faller om varan inte skickas tillbaka genast (7.1d brist): ”Rätten att frånträda avtalet gäller inte om
# varan … inte returneras omgående”, ”Skickas varan inte tillbaka direkt förlorar du ångerrätten”.
LATE_LOSS: '(inte|ej)\s+(\w+\s+){0,3}?(returneras|skickas\s+(tillbaka|åter|i\s+retur)|återsänds|återlämnas|sänds\s+tillbaka)\s+(till\s+oss\s+)?(omgående|direkt|omedelbart|genast|med\s+en\s+gång)|(returneras|skickas\s+(tillbaka|åter|i\s+retur)|återsänds|återlämnas)\s+(\w+\s+){0,2}?(inte|ej)\s+(\w+\s+){0,2}?(omgående|direkt|omedelbart|genast)'
LOSS: 'gäller\s+(heller\s+)?(inte|ej)|upphör|bortfaller|förfaller|faller\s+bort|förlora\w*|går\s+förlorad|nekas|neka\b'
# Ett returfönster på 28 dagar eller mer från mottagandet räcker till 14 dagars ångerfrist och 14 dagars returtid efter
# ångermeddelandet; utan text om returtiden blir 7.1d då osäker, inte brist. Räknas bara när meningen eller rubriken
# närmast ovanför ger fönstret som ångerrätten (app/text/facts.py returfonster); öppet köp vid sidan av räknas inte.
WINDOW: '{NUM}\s*dagar\w*\s+(fri\w*\s+|full\w*\s+)?(öppet köp|öppna köp|returrätt|bytes-? och returrätt|retur\w*)|(öppet köp|öppna köp|returrätt\w*|returnera\w*|skicka\w* tillbaka|retur\w*)[^.]{0,90}?(inom|i|under|på)\s+{NUM}\s*dagar'
# Butikens eget webbformulär för att ångra eller returnera (7.1e): inte standardformuläret, men det kan innehålla samma
# uppgifter, så det ger osäker (granskningsriktlinje: eget formulär → osäker).
OWN_FORM: 'fyll\w*\s+i\s+(dina\s+|era\s+|alla\s+)?(uppgifter\w*|formulär\w*|fälten)\s+(nedan|här nedan|här|ovan)|(genom|via|i|med)\s+(vårt\s+|det\s+|detta\s+)?(webb)?formulär\w*\s+(nedan|ovan|här nedan|på (denna|den här) sida)|fyll\w*\s+i\s+(vårt\s+|det\s+)?(digitala\s+)?(ånger|retur|webb)formulär\w*'
FORM:
  - 'standardblankett'
  - 'standardformulär'
  - 'ångerblankett'
  - 'blankett för (utövande av )?ångerrätt'
  - 'formulär för (utövande av )?ångerrätt'
  - 'konsumentverkets blankett'
  # Blanketten under andra namn: ”Konsumentverkets mall för att ångra”, ”standardmallen”, ”ångermall”, ”en mall finns på
  # Konsumentverkets webbplats”, ”blankett som Konsumentverket tillhandahåller”. Den nämns, så den saknas inte; om den
  # ges behöver läsas (osäker, inte brist).
  - 'ångermall\w*'
  - 'standardmall\w*'
  - 'konsumentverkets\s+(\w+\s+)?mall\w*'
  - '\bmall\w*\s+[^.]{0,60}?konsumentverket\w*'
  - '(blankett|formulär)\w*\s+[^.]{0,30}?konsumentverket\s+(tillhandahåller|har tagit fram|tagit fram|ger ut)'
FORM_HREF:
  - 'anger-?blankett'
  - '%c3%a5ngerblankett'
  - 'ångerblankett'
  - 'angerformular'
  - 'standardformular'
  - 'standardblankett'
  - 'withdrawal-?form'
  - 'angra-?kop.*\.pdf'
COND_STRONG:
  - 'oanvänd\w*'
  # ”i ett skick som är oanvänt”, ”i perfekt oanvänt skick”
  - 'oanvänt\b'
  - 'originalförpackning\w*'
  - 'originalkartong\w*'
  - 'originalemballage\w*'
  - 'obrut\w*'
  - 'oöppnad\w*'
  - 'oöppnat'
  - 'nyskick'
  - 'originalskick'
  - 'ursprungligt skick'
  - '(inte|ej) (får )?(ha )?(skadats eller )?(på något sätt )?använts'
  - 'har använts'
  # not ”Om du inte använder vår returfraktsedel”: the customer using something, not the goods being used
  - '(inte|ej) (än |ännu )?(har )?(är |blivit |varit )?(använd(a|as|es|t)?\b|använts)'
  - 'bruten förpackning'
  - 'brutna förpackning'
  - 'bruten plombering'
  - '(inte|ej) kan sälja (den |varan |produkten )?vidare'
  - 'säljas vidare'
  - 'samma skick som (de|den) var i'
  - 'samma skick som (vid|när) (leverans|du (fick|tog emot|mottog))'
  - 'oskadad förpackning'
  - 'oskadad originalförpackning'
  - 'oförändrat skick (inklusive|med|och i) (original)?förpackning'
  - 'samma skick och mängd'
# 7.2, skicket som nekas, inte bara skicket som krävs: ”Är varan använd … godkänns inte returen”, ”… får inte vara använd”,
# ”Använd eller monterad vara omfattas inte av ångerrätten”, ”Har du monterat skärmskyddet …”. Inte ”Produkten skall vara
# använd med gott omdöme”. Läses som COND_STRONG i 7.2; i 7.1a är montering och bruten förpackning egna undantag.
COND_REFUSED:
  - '^\W*(är|har) (varan|produkten|varorna|produkterna) (varit )?använ[dt]\w*\b'
  - '\bom (varan|produkten|varorna|produkterna) (är|har varit|blivit|har) använ[dt]\w*\b'
  # ”Använda produkter kan inte returneras”, ”Varor med saknade etiketter eller skadad förpackning återbetalas inte”
  - '\banvända\s+(varor|produkter|artiklar|plagg|kläder|skor)\b'
  - '(saknade|saknar|borttagna|avklippta|avtagna)\s+(\w+\s+)?(etiketter|prislappar|lappar|taggar)\b'
  - '(?<![oO])skadad\w*\s+(original)?(förpackning|kartong|emballage)\w*'
