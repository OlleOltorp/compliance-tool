# 10a ARN. "ARN" only in capitals (Arn is a name; "Arninge" is a place); the rest in any case.
# Common misspellings count: "Allmäna reklamationsnämnden", "reklamationsnämd", "www.arn.se".
ARN_NAME:
  - '(?-i:\bARN\b)'
  - '\barn\.se\b'
  - 'reklamationsnämn?d\w*'
  - 'allmänn?a\s+reklamations\w*'
  - 'national board for consumer (disputes|complaints)'
  # "arn" in lower case only next to a dispute word ("anmäla ärendet till arn"), since Arn is also a name
  - '\barn(:?s)?\b(?=[^.]{0,80}\b(tvist|anmäl|pröva|klagomål))'
  - '\b(tvist|anmäl|pröva|klagomål)\w*[^.]{0,80}\barn(:?s)?\b'
# Says there is an out-of-court body without naming ARN ("alternativt tvistlösningsorgan"): not enough for
# uppfyllt, but no proof of brist either.
ARN_WEAK:
  - 'alternativ\w*\s+tvistlösning\w*'
  - 'tvistlösningsorgan\w*'
  - 'tvistlösningsnämnd\w*'
  - 'konsumenttvist\w*'
