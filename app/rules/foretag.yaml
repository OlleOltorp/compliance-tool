# 1 Företagsuppgifter.
# Ett värde är ett reguljärt uttryck eller en lista med alternativ (de sätts ihop med |).
# {NUM} betyder ett tal i siffror eller ord.

# bolagsform efter namnet (AB, Handelsbolag, ek. för. …), eller en enskild firma med sitt namn ("Enskild firma: Anna Design"),
# bolagsformen före namnet ("AB Exempelbutiken", "Aktiebolaget Exempelhem"), eller namnet efter en rubrik för det
# ("Företagsnamn: Exempelfirman HB", "Företagets namn: AB Exempelbutiken"); en tom rubrik följd av nästa
# fält ("Företagsnamn: Org.nr: …") är inget namn
COMPANY: '\b(?:[Ff]öretagsnamn|[Ff]öretagets\snamn|[Bb]olagsnamn|[Bb]olagets\snamn|[Jj]uridiskt\snamn|[Ff]irmanamn|Firma)\s*:\s*(?!(?:Org|Adress|Telefon|Tel|E-?post|Mail|Momsreg|VAT|Säte|Kontakt)\w*\b)[A-ZÅÄÖ][\wÅÄÖåäö&.\-]*(?:\s[A-ZÅÄÖ0-9][\wÅÄÖåäö&.\-]*){0,4}|\b(?-i:AB|Aktiebolaget)\s(?!(?:Org|Box|Tel)\b)[A-ZÅÄÖ][\wÅÄÖåäö&\-]{2,}(?:\s[A-ZÅÄÖ][\wÅÄÖåäö&\-]*){0,3}|\b[A-ZÅÄÖ][\wÅÄÖåäö&.\-]*(?:\s[A-ZÅÄÖ0-9][\wÅÄÖåäö&.\-]*){0,4}\s(?:AB|Aktiebolag|HB|Handelsbolag|KB|Kommanditbolag|Ekonomisk\sförening|ek\.\s?för|ApS|A/S|AS|Oy|Ltd|GmbH)\b(\s\(publ\))?|\b[Ee]nskild\s(?:firma|näringsidkare):?\s+[A-ZÅÄÖ][\wÅÄÖåäö&.\-]*(?:\s[A-ZÅÄÖ][\wÅÄÖåäö&.\-]*){0,4}'
